function _estrella(cx, cy, r, fill) {

  return `<path d="${p}Z" fill="${fill}"/>`;
}

}

function escena(tema, clase) {

    <radialGradient id="${id}s"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect width="320" height="180" fill="url(#${id})"/><circle cx="268" cy="30" r="70" fill="url(#${id}s)"/>${_brillos()}${T.d()}${_olas(T.o[0], T.o[1])}</svg>`;

const INSIGNIAS = {

  E3: ['Decisión tomada', 'diana', '#6c4ab6'], AUTONOMIA: ['Voz propia', 'medalla', '#e3b505'],
  F1: ['Familia que escucha', 'corazon', '#c8553d'], F2: ['Familia que acompaña', 'manos', '#1f9e8f']
};
function insignia(cod, ganada, titulo) {
  const d = INSIGNIAS[cod] || [titulo || cod, 'medalla', '#0f4c9c'];
  return `<div class="insignia ${ganada ? 'ganada' : ''}" title="${ganada ? '¡Lograda!' : 'Por desbloquear'}">
    <div class="medalla" style="--c:${d[2]}">${ic(ganada ? d[1] : 'candado', 26)}</div><b>${d[0]}</b><small>${ganada ? '¡Lograda!' : 'Por desbloquear'}</small></div>`;
}

/* ---------- Anillo de progreso ---------- */
function anillo(pct, etiqueta) {
  const r = 42, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct));
  return `<div class="anillo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" stroke="rgba(255,255,255,.18)" stroke-width="10" fill="none"/>
    <circle cx="50" cy="50" r="${r}" stroke="url(#gAnillo)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}" transform="rotate(-90 50 50)"/>
    <defs><linearGradient id="gAnillo"><stop offset="0" stop-color="#f4d35e"/><stop offset="1" stop-color="#ff8f6b"/></linearGradient></defs></svg>
    <div><b>${Math.round(v)}%</b><small>${etiqueta}</small></div></div>`;
}

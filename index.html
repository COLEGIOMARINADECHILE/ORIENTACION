<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8"><title>Mi Proyecto de Vida &middot; Colegio Marina de Chile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js y la librería de Excel se cargan solo cuando se necesitan (ver cargarScript en App). -->
  <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
  <style>
:root {
  --navy: #0b2a66;
  --navy-2: #123a85;
  --mar: #0f4c9c;
  --oro: #e3b505;
  --oro-2: #f4d35e;
  --ladrillo: #c8553d;
  --turquesa: #1f9e8f;
  --violeta: #6c4ab6;
  --fondo: #f5f3ee;
  --papel: #ffffff;
  --tinta: #14213d;
  --tinta-2: #4a5470;
  --linea: #e3e0d8;
  --suave: #eef2fa;
  --ok: #1f9e6b;
  --alerta: #d9822b;
  --peligro: #c8443d;
  --sombra: 0 10px 30px rgba(11, 42, 102, .10);
  --radio: 18px;
  --sidebar: 252px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0d1424; --papel: #151f35; --tinta: #edf1fa; --tinta-2: #a9b4cc; --linea: #26324d; --suave: #1b2843;
    --sombra: 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --fondo: #0d1424; --papel: #151f35; --tinta: #edf1fa; --tinta-2: #a9b4cc; --linea: #26324d; --suave: #1b2843;
  --sombra: 0 10px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--tinta); background: var(--fondo);
  font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
h1, .display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -.01em; }
a { color: var(--mar); }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--tinta); }
img { max-width: 100%; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Ingreso ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; }
.login-hero {
  position: relative; overflow: hidden; color: #fff; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(1200px 600px at 10% 0%, #1d4fa8 0%, var(--navy) 55%, #071b44 100%);
}
.login-hero .foto { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .22; mix-blend-mode: luminosity; }
.login-hero > * { position: relative; }
.marca { display: flex; align-items: center; gap: 14px; }
.marca img, .marca svg { width: 58px; height: 70px; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
.marca b { display: block; font-size: 1.05rem; letter-spacing: .02em; }
.marca span { opacity: .8; font-size: .85rem; }
.hero-titulo { font-size: clamp(2.2rem, 4.2vw, 3.6rem); margin: 28px 0 12px; max-width: 12ch; }
.hero-titulo em { color: var(--oro-2); font-style: italic; }
.hero-sub { max-width: 46ch; opacity: .9; font-size: 1.05rem; }
.hero-ilus { width: min(440px, 88%); align-self: center; margin-top: 18px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.35)); }
.olas { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; opacity: .45; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
.tarjeta-login { width: 100%; max-width: 420px; }
.tarjeta-login h2 { font-family: 'Fraunces', serif; font-size: 1.9rem; }
.perfiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.perfil-op {
  border: 1.5px solid var(--linea); background: var(--papel); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: .82rem; font-weight: 600; color: var(--tinta-2);
  transition: all .15s ease;
}
.perfil-op .ico { display: block; font-size: 1.35rem; margin-bottom: 2px; }
.perfil-op[aria-pressed="true"] { border-color: var(--mar); color: var(--mar); background: var(--suave); box-shadow: 0 0 0 3px rgba(15,76,156,.12); }
.aviso-priv { font-size: .8rem; color: var(--tinta-2); margin-top: 16px; }

/* ---------- Controles ---------- */
.campo { display: block; margin-bottom: 14px; }
.campo > span { display: block; font-weight: 600; font-size: .86rem; margin-bottom: 6px; }
.campo small { color: var(--tinta-2); font-size: .78rem; }
.input, select.input, textarea.input {
  width: 100%; border: 1.5px solid var(--linea); background: var(--papel); border-radius: 12px; padding: 11px 13px; outline: none; transition: border .15s, box-shadow .15s;
}
.input:focus { border-color: var(--mar); box-shadow: 0 0 0 3px rgba(15,76,156,.14); }
textarea.input { min-height: 96px; resize: vertical; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700;
  background: var(--navy); color: #fff; transition: transform .12s ease, background .15s; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--navy-2); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.oro { background: var(--oro); color: #1d1600; }
.btn.oro:hover { background: var(--oro-2); }
.btn.sec { background: var(--suave); color: var(--navy); }
[data-theme="dark"] .btn.sec, :root:not([data-theme="light"]) .btn.sec { color: var(--tinta); }
.btn.peligro { background: var(--peligro); }
.btn.mini { padding: 6px 11px; font-size: .82rem; border-radius: 9px; }
.btn.bloque { width: 100%; }
.btn.fantasma { background: transparent; color: var(--tinta-2); }
.btn.fantasma:hover { background: var(--suave); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: .76rem; font-weight: 700; background: var(--suave); color: var(--mar); }
.chip.oro { background: #fdf3cc; color: #7a5b00; }
.chip.ok { background: #dcf3e8; color: #156b48; }
.chip.alerta { background: #fdebd8; color: #8a4b0c; }
.chip.peligro { background: #fbe0de; color: #8f2620; }
.chip.violeta { background: #ece5fa; color: #4b2c94; }
.err { color: var(--peligro); font-size: .86rem; margin: 6px 0 0; min-height: 1.2em; }

/* ---------- Estructura ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.lateral {
  background: var(--navy); color: #dfe7fb; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column;
}
.lateral .marca { padding: 4px 8px 18px; }
.lateral .marca img, .lateral .marca svg { width: 40px; height: 48px; }
.lateral .marca b { font-size: .92rem; color: #fff; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; color: inherit; padding: 10px 12px; border-radius: 12px; font-weight: 600; text-align: left; font-size: .92rem;
}
.nav button:hover { background: rgba(255,255,255,.08); }
.nav button.activo { background: rgba(227,181,5,.16); color: #fff; box-shadow: inset 3px 0 0 var(--oro); }
.nav .ico { width: 22px; text-align: center; font-size: 1.05rem; }
.nav .badge { margin-left: auto; background: var(--ladrillo); color: #fff; font-size: .7rem; border-radius: 999px; padding: 1px 7px; }
.nav-sep { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; opacity: .55; padding: 14px 12px 4px; }
.lateral .pie { margin-top: auto; padding: 14px 8px 0; font-size: .78rem; opacity: .75; }
.principal { min-width: 0; }
.barra {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--fondo) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea);
}
.barra h2 { margin: 0; font-size: 1.15rem; flex: 1; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; font-size: .9rem;
  background: linear-gradient(135deg, var(--mar), var(--violeta));
}
.avatar.g { width: 56px; height: 56px; font-size: 1.2rem; }
.contenido { padding: 24px 28px 90px; max-width: 1180px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px; box-shadow: var(--sombra); min-width: 0; }
.tarjeta h3 { font-size: 1.05rem; }
.tarjeta.plana { box-shadow: none; }
.fila { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fila.entre { justify-content: space-between; }
.mt { margin-top: 16px; } .mt2 { margin-top: 28px; }
.muted { color: var(--tinta-2); }
.peq { font-size: .84rem; }
.vacio { text-align: center; color: var(--tinta-2); padding: 34px 10px; }
.vacio .ico { font-size: 2.2rem; display: block; margin-bottom: 6px; }

/* Hero de inicio */
.hola {
  position: relative; overflow: hidden; border-radius: 24px; padding: 28px 30px; color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
  background: linear-gradient(120deg, var(--navy) 0%, var(--mar) 60%, #2a6fd6 100%);
}
.hola h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin-bottom: 6px; }
.hola p { margin: 0; opacity: .92; max-width: 54ch; }
.hola .ilus { width: 210px; margin: -20px -10px -34px 0; filter: drop-shadow(0 14px 22px rgba(0,0,0,.3)); }
.hola .timon { position: absolute; right: -60px; top: -60px; width: 260px; opacity: .08; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-size: 1.9rem; font-family: 'Fraunces', serif; line-height: 1; }
.kpi span { color: var(--tinta-2); font-size: .84rem; }
.kpi .ico { font-size: 1.4rem; }

/* Historias (sesiones estilo stories) */
.historias { display: flex; gap: 14px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: thin; }
.historia { flex: none; width: 86px; text-align: center; border: 0; background: none; color: var(--tinta); padding: 0; }
.historia .aro { width: 76px; height: 76px; margin: 0 auto 6px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--oro), var(--ladrillo), var(--violeta), var(--mar), var(--oro)); }
.historia .aro.visto { background: var(--linea); }
.historia .aro > div { width: 100%; height: 100%; border-radius: 50%; background: var(--papel); display: grid; place-items: center; font-size: 1.9rem; border: 3px solid var(--papel); }
.historia small { display: block; font-size: .74rem; font-weight: 600; line-height: 1.25; }

/* Tarjetas de sesión */
.sesion-card { display: flex; flex-direction: column; overflow: hidden; padding: 0; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; text-align: left; border: 1px solid var(--linea); background: var(--papel); border-radius: var(--radio); color: inherit; }
.sesion-card:hover { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(11,42,102,.16); }
.sesion-card .portada { height: 118px; display: grid; place-items: center; font-size: 3rem; position: relative; }
.sesion-card .num { position: absolute; left: 14px; top: 12px; background: rgba(255,255,255,.92); color: var(--navy); font-weight: 800; border-radius: 10px; padding: 2px 10px; font-size: .78rem; }
.sesion-card .cuerpo { padding: 14px 16px 16px; }
.sesion-card h3 { font-size: 1.02rem; margin-bottom: 4px; }
.p1 { background: linear-gradient(135deg, #ffe7a3, #ffc65c); }
.p2 { background: linear-gradient(135deg, #cfe6ff, #8dbcf7); }
.p3 { background: linear-gradient(135deg, #d5f5ec, #7fd6c2); }
.p4 { background: linear-gradient(135deg, #ffd9cf, #f3a08a); }
.p5 { background: linear-gradient(135deg, #e7dcff, #b59af0); }
.p6 { background: linear-gradient(135deg, #e0f0d6, #a5d38a); }
.p0 { background: linear-gradient(135deg, #dfe6f3, #aebbd6); }

/* Detalle de sesión */
.sesion-head { border-radius: 24px; padding: 26px 28px; position: relative; overflow: hidden; color: var(--navy); }
.sesion-head h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); }
.sesion-head .emoji { position: absolute; right: 24px; bottom: -14px; font-size: 6rem; opacity: .9; }
.bloque { border-radius: 16px; padding: 18px 20px; margin-top: 14px; background: var(--papel); border: 1px solid var(--linea); }
.bloque h3 { display: flex; align-items: center; gap: 8px; font-size: 1.02rem; }
.bloque.caso { background: #fff8e6; border-color: #f3dfa2; }
.bloque.psicologia { background: #eef4ff; border-color: #c9d9f7; }
.bloque.ejercicio { background: #eaf7f3; border-color: #bfe5da; }
.bloque.recuerde { background: #fdeeea; border-color: #f2c7bb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bloque.caso, :root:not([data-theme="light"]) .bloque.psicologia, :root:not([data-theme="light"]) .bloque.ejercicio, :root:not([data-theme="light"]) .bloque.recuerde { background: var(--suave); border-color: var(--linea); } }
:root[data-theme="dark"] .bloque.caso, :root[data-theme="dark"] .bloque.psicologia, :root[data-theme="dark"] .bloque.ejercicio, :root[data-theme="dark"] .bloque.recuerde { background: var(--suave); border-color: var(--linea); }
.etq { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--tinta-2); }
.pop-btn { border: 0; background: var(--oro); color: #1d1600; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: .85rem; box-shadow: 0 6px 14px rgba(227,181,5,.35); }
.pop-btn:hover { transform: translateY(-1px); }

/* Cuestionarios */
.pregunta { padding: 18px 0; border-bottom: 1px dashed var(--linea); }
.pregunta:last-child { border-bottom: 0; }
.pregunta .enun { font-weight: 700; margin-bottom: 10px; }
.pregunta .enun .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--navy); color: #fff; font-size: .8rem; margin-right: 8px; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opcion { position: relative; }
.opcion input { position: absolute; opacity: 0; }
.opcion span { display: inline-block; border: 1.5px solid var(--linea); border-radius: 999px; padding: 8px 14px; font-size: .9rem; background: var(--papel); transition: all .12s; cursor: pointer; }
.opcion input:checked + span { background: var(--navy); border-color: var(--navy); color: #fff; }
.opcion input:focus-visible + span { box-shadow: 0 0 0 3px rgba(15,76,156,.3); }
.escala { width: 100%; border-collapse: collapse; }
.escala td, .escala th { padding: 8px 6px; border-bottom: 1px solid var(--linea); font-size: .9rem; }
.escala th { font-size: .74rem; color: var(--tinta-2); font-weight: 700; text-align: center; }
.escala td.o { text-align: center; width: 64px; }
.escala input { width: 20px; height: 20px; accent-color: var(--navy); }
.progreso { height: 8px; background: var(--suave); border-radius: 999px; overflow: hidden; }
.progreso > div { height: 100%; background: linear-gradient(90deg, var(--oro), var(--ladrillo)); border-radius: 999px; transition: width .3s ease; }
.resultado { border-radius: 22px; padding: 24px; background: linear-gradient(135deg, #fff8e1, #ffe9b0); color: #3b2c00; }
.resultado h2 { font-family: 'Fraunces', serif; }

/* Chat / muro */
.chat { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 150px); min-height: 460px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; }
.chat-lista { border-right: 1px solid var(--linea); overflow-y: auto; }
.chat-item { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 12px 14px; border-bottom: 1px solid var(--linea); align-items: center; }
.chat-item:hover, .chat-item.activo { background: var(--suave); }
.chat-item .txt { min-width: 0; flex: 1; }
.chat-item .txt b { display: block; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item .txt small { display: block; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .8rem; }
.chat-item .nl { background: var(--ladrillo); color: #fff; font-size: .7rem; border-radius: 999px; padding: 1px 7px; font-weight: 700; }
.chat-panel { display: flex; flex-direction: column; min-width: 0; }
.chat-cab { padding: 12px 16px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 10px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; background:
  radial-gradient(circle at 20px 20px, rgba(15,76,156,.05) 2px, transparent 2.5px) 0 0/28px 28px; }
.burbuja { max-width: 74%; padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: var(--suave); align-self: flex-start; font-size: .93rem; white-space: pre-wrap; word-wrap: break-word; }
.burbuja.mia { align-self: flex-end; border-radius: 18px 18px 6px 18px; background: linear-gradient(135deg, var(--mar), var(--navy)); color: #fff; }
.burbuja small { display: block; font-size: .7rem; opacity: .7; margin-top: 3px; }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--linea); }
.chat-form textarea { min-height: 44px; height: 44px; resize: none; border-radius: 22px; padding: 11px 16px; }
.post { padding: 16px 18px; }
.post .cab { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.post .texto { white-space: pre-wrap; }
.post .acc { display: flex; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--linea); }
.like { border: 0; background: none; color: var(--tinta-2); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 10px; }
.like.on { color: var(--ladrillo); }
.like:hover { background: var(--suave); }

/* Tablas */
.tabla-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--linea); }
table.tabla { width: 100%; border-collapse: collapse; background: var(--papel); font-size: .9rem; }
.tabla th { text-align: left; background: var(--suave); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-2); padding: 10px 12px; white-space: nowrap; }
.tabla td { padding: 10px 12px; border-top: 1px solid var(--linea); vertical-align: top; }
.tabla tr:hover td { background: color-mix(in srgb, var(--suave) 50%, transparent); }
.nivel { display: inline-block; min-width: 34px; text-align: center; border-radius: 8px; padding: 2px 6px; font-weight: 800; font-size: .82rem; }
.n1 { background: #fbe0de; color: #8f2620; } .n2 { background: #fdebd8; color: #8a4b0c; } .n3 { background: #dcf3e8; color: #156b48; } .n4 { background: #cdeee0; color: #0b5a3a; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tab { border: 1.5px solid var(--linea); background: var(--papel); color: var(--tinta-2); border-radius: 999px; padding: 7px 15px; font-weight: 700; font-size: .86rem; }
.tab.activo { background: var(--navy); color: #fff; border-color: var(--navy); }
.lienzo { position: relative; height: 280px; }
.lienzo.alto { height: 340px; }
.ia-card { border-radius: 20px; padding: 22px; background: linear-gradient(160deg, var(--papel) 0%, var(--suave) 100%); border: 1px solid var(--linea); }
.ia-card h4 { margin: 16px 0 6px; font-size: .92rem; display: flex; gap: 6px; align-items: center; }
.ia-card ul { margin: 0; padding-left: 20px; }
.ia-card li { margin-bottom: 4px; }
.sello { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--tinta-2); padding: 10px 12px; border-radius: 12px; background: var(--suave); margin-top: 12px; }

/* Modal / toast */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(8,18,40,.55); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(3px); }
.modal[hidden] { display: none; }
.modal-caja { background: var(--papel); border-radius: 22px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 24px; box-shadow: 0 30px 60px rgba(0,0,0,.3); animation: subir .2s ease; }
.modal-caja.ancho { max-width: 920px; }
.modal-caja .cerrar { float: right; border: 0; background: var(--suave); border-radius: 10px; width: 34px; height: 34px; font-size: 1.1rem; color: var(--tinta); }
.pop-caja { text-align: center; max-width: 440px; }
.pop-caja .ico { font-size: 3rem; }
@keyframes subir { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 12px 18px; border-radius: 14px; z-index: 200; font-weight: 600; box-shadow: var(--sombra); max-width: 90vw; }
.toast.error { background: var(--peligro); color: #fff; }
.cargando { display: grid; place-items: center; padding: 60px 0; color: var(--tinta-2); }
.spin { width: 34px; height: 34px; border: 3px solid var(--linea); border-top-color: var(--mar); border-radius: 50%; animation: girar .8s linear infinite; margin-bottom: 10px; }
@keyframes girar { to { transform: rotate(360deg); } }
.editor-bloque { border: 1px solid var(--linea); border-radius: 14px; padding: 12px; margin-bottom: 10px; background: var(--fondo); }
.drop { border: 2px dashed var(--linea); border-radius: 16px; padding: 26px; text-align: center; background: var(--fondo); }
.drop.sobre { border-color: var(--mar); background: var(--suave); }

/* =================== Capa visual renovada =================== */
body {
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(227,181,5,.12), transparent 60%),
    radial-gradient(800px 600px at -10% 110%, rgba(31,158,143,.10), transparent 60%),
    var(--fondo);
  background-attachment: fixed;
}
.ic { flex: none; vertical-align: -0.2em; }
.btn .ic { vertical-align: 0; }
.btn { box-shadow: 0 4px 12px rgba(11,42,102,.18); }
.btn.oro { background: linear-gradient(135deg, #f7d24a, #e3a805); box-shadow: 0 6px 16px rgba(227,165,5,.35); }
.btn.oro:hover { background: linear-gradient(135deg, #ffdc5e, #efb30f); transform: translateY(-1px); }
.btn.sec, .btn.fantasma { box-shadow: none; }
.btn.vidrio { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px); box-shadow: none; }
.btn.vidrio:hover { background: rgba(255,255,255,.26); }
.tarjeta { transition: transform .18s ease, box-shadow .18s ease; }
h3 .ic { color: var(--mar); }

/* Ingreso */
.perfil-op .ico { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 6px; border-radius: 12px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.perfil-op[aria-pressed="true"] { border-color: var(--c); color: var(--tinta); background: color-mix(in srgb, var(--c) 8%, var(--papel)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.perfil-op[aria-pressed="true"] .ico { background: var(--c); color: #fff; }
.perfil-op:hover { transform: translateY(-2px); }
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.hero-chips span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: .84rem; font-weight: 600; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(4px); }
.hero-chips .ic { color: var(--oro-2); }
.login-hero .hero-ilus { animation: flotar 6s ease-in-out infinite; }
.login-form { background: radial-gradient(600px 400px at 100% 0%, rgba(227,181,5,.14), transparent 70%); }
@keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Barra lateral */
.lateral { background: linear-gradient(180deg, #0b2a66 0%, #0a2258 60%, #071a45 100%); overflow-x: hidden; }
.lateral-timon { position: absolute; width: 260px; right: -90px; bottom: -70px; opacity: .06; pointer-events: none; animation: girar 60s linear infinite; }
.nav button .ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.06); }
.nav button.activo .ico { background: linear-gradient(135deg, #f7d24a, #e3a805); color: #1d1600; }
.pie-tarjeta { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.07); }
.pie-tarjeta b { display: block; color: #fff; font-size: .86rem; }
.pie-tarjeta span { font-size: .74rem; opacity: .8; }
.avatar { box-shadow: 0 0 0 2px var(--papel), 0 0 0 4px rgba(227,181,5,.6); }
.avatar.aro-story { box-shadow: 0 0 0 2px var(--papel), 0 0 0 4px transparent; background: linear-gradient(135deg, var(--ladrillo), var(--violeta)); position: relative; }
.avatar.aro-story::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; padding: 2px; background: conic-gradient(var(--oro), var(--ladrillo), var(--violeta), var(--oro));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

/* Héroe de inicio */
.hola { min-height: 230px; background: linear-gradient(120deg, #0b2a66 0%, #0f4c9c 55%, #2a7be0 100%); box-shadow: 0 20px 40px rgba(11,42,102,.25); }
.hola::before { content: ''; position: absolute; inset: auto -10% -60px -10%; height: 120px; background: radial-gradient(60% 100% at 50% 100%, rgba(255,255,255,.16), transparent 70%); }
.hola.con-foto { background: #0b2a66; }
.hola-foto { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: -1; }
.hola-foto::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, rgba(11,42,102,.96) 0%, rgba(15,76,156,.82) 50%, rgba(200,85,61,.45) 100%); }
.hola.con-foto { isolation: isolate; }
.hola-txt { position: relative; z-index: 1; }
.hola .saludo { margin: 12px 0 0; opacity: .85; font-weight: 600; }
.hola .ilus { width: 260px; position: relative; z-index: 1; animation: flotar 6s ease-in-out infinite; }
.ola-mano { display: inline-block; animation: saludar 2.4s ease-in-out 1; transform-origin: 70% 70%; }
@keyframes saludar { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
.burbuja-deco { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
.burbuja-deco.b1 { width: 140px; height: 140px; left: 42%; top: -50px; }
.burbuja-deco.b2 { width: 70px; height: 70px; left: 58%; bottom: -20px; background: rgba(227,181,5,.18); }
.hola-acc { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 16px; }
.anillo { display: flex; align-items: center; gap: 10px; }
.anillo svg { width: 76px; height: 76px; }
.anillo b { display: block; font-family: 'Fraunces', serif; font-size: 1.5rem; line-height: 1; }
.anillo small { opacity: .85; font-size: .78rem; }
.aviso-clave { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 16px; background: #fff8e6; border: 1px solid #f3dfa2; color: #5a4300; }
.aviso-clave span { flex: 1; min-width: 200px; }
.frase { display: flex; gap: 14px; align-items: center; padding: 16px 20px; border-radius: 18px; color: #3b2c00;
  background: linear-gradient(120deg, #fff6d6, #ffe7a8 60%, #ffd9cf); border: 1px solid #f3dfa2; }
.frase .ic { color: #c88a00; }
.frase b { display: block; font-family: 'Fraunces', serif; font-size: 1.15rem; }
.frase span { font-size: .9rem; opacity: .85; }

/* Ruta de navegación (sesiones) */
.ruta { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 18px; overflow-x: auto; padding: 14px 4px 16px; scroll-snap-type: x mandatory; }
.ruta::before { content: ''; position: absolute; left: 40px; right: 40px; top: 72px; border-top: 3px dashed color-mix(in srgb, var(--mar) 35%, transparent); z-index: 0; }
.parada { position: relative; z-index: 1; border: 0; background: var(--papel); border-radius: 20px; padding: 0 0 12px; text-align: left; color: var(--tinta); box-shadow: var(--sombra); overflow: hidden; scroll-snap-align: start; transition: transform .18s ease, box-shadow .18s ease; border: 2px solid transparent; }
.parada:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: 0 18px 34px rgba(11,42,102,.18); }
.parada.actual { border-color: var(--oro); box-shadow: 0 0 0 4px rgba(227,181,5,.25), var(--sombra); }
.parada.actual::after { content: 'Siguiente'; position: absolute; top: 10px; right: 10px; background: var(--oro); color: #1d1600; font-size: .7rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.parada-img { position: relative; height: 104px; }
.parada-img .escena { width: 100%; height: 100%; display: block; }
.parada.hecha .parada-img { filter: saturate(.9); }
.parada-ok { position: absolute; left: 10px; top: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 3px #fff; }
.parada-num { display: block; padding: 10px 14px 0; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ladrillo); }
.parada b { display: block; padding: 2px 14px 0; font-size: .92rem; line-height: 1.3; }

/* KPIs con color */
.kpi.color { position: relative; overflow: hidden; border: 0; color: #fff; }
.kpi.color span { color: rgba(255,255,255,.88); }
.kpi.color::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -40px; top: -40px; background: rgba(255,255,255,.14); }
.kpi.c1 { background: linear-gradient(135deg, #0f4c9c, #2a7be0); }
.kpi.c2 { background: linear-gradient(135deg, #e3a805, #f7c948); color: #2b2000; } .kpi.c2 span { color: rgba(43,32,0,.75); }
.kpi.c3 { background: linear-gradient(135deg, #c8553d, #ef8a6b); }
.kpi.c4 { background: linear-gradient(135deg, #1f9e8f, #4cc3a9); }
.kpi-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.22); margin-bottom: 8px; }
.kpi.color:hover { transform: translateY(-3px); }

/* Insignias */
.insignias { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
.insignia { text-align: center; padding: 16px 10px; border-radius: 18px; background: var(--papel); border: 1px solid var(--linea); transition: transform .18s ease; }
.insignia .medalla { width: 66px; height: 66px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; color: #fff; position: relative;
  background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 20%, transparent), 0 10px 20px color-mix(in srgb, var(--c) 35%, transparent); }
.insignia b { display: block; font-size: .84rem; line-height: 1.25; }
.insignia small { color: var(--tinta-2); font-size: .74rem; }
.insignia:not(.ganada) .medalla { background: var(--suave); color: var(--tinta-2); box-shadow: none; }
.insignia:not(.ganada) b { color: var(--tinta-2); }
.insignia.ganada:hover { transform: translateY(-3px) scale(1.03); }
.insignia.ganada .medalla::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 250% 100%; animation: brillo 3.5s ease-in-out infinite; }
@keyframes brillo { 0% { background-position: 150% 0; } 60%, 100% { background-position: -100% 0; } }

/* Pendientes y cuestionarios */
.pendiente { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--papel); border: 1px solid var(--linea); margin-bottom: 10px; box-shadow: var(--sombra); }
.pendiente b { display: block; margin-top: 4px; }
.pend-ico, .cuest-ico { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--oro), var(--ladrillo)); }
.cuest-card { display: flex; gap: 14px; align-items: flex-start; border-top: 4px solid var(--c); }
.cuest-card .cuest-ico { background: var(--c); }
.cuest-card.hecho .cuest-ico { background: var(--ok); }
.cuest-card:hover { transform: translateY(-3px); }

/* Tarjetas de sesión y cursos con ilustración */
.sesion-card .portada { height: 150px; padding: 0; display: block; overflow: hidden; }
.sesion-card .portada .escena { width: 100%; height: 100%; display: block; transition: transform .4s ease; }
.sesion-card:hover .portada .escena { transform: scale(1.06); }
.sesion-card .num { z-index: 1; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.visto-chip { position: absolute; right: 12px; top: 12px; background: var(--ok); color: #fff; font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
.curso-card { padding: 0 0 16px; overflow: hidden; }
.curso-card > .fila { padding: 0 16px; }
.curso-card > .fila.entre { padding-top: 12px; }
.curso-portada { position: relative; height: 96px; }
.curso-portada .escena { width: 100%; height: 100%; display: block; }
.curso-nombre { position: absolute; left: 14px; bottom: 10px; background: rgba(255,255,255,.95); color: var(--navy); font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.25rem; padding: 2px 12px; border-radius: 12px; }

/* Encabezado de sesión */
.sesion-head { min-height: 230px; padding: 0; display: flex; align-items: flex-end; color: #fff; isolation: isolate; box-shadow: 0 18px 36px rgba(11,42,102,.2); }
.sesion-head .escena.fondo { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
.sesion-head::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(8,24,64,.9) 0%, rgba(8,24,64,.65) 45%, rgba(8,24,64,0) 80%); }
.sesion-head-txt { padding: 26px 28px; max-width: 640px; }
.sesion-head h1 { color: #fff; margin-top: 10px; }
.objetivo { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 8px; }
.objetivo .ic { color: var(--oro-2); margin-top: 2px; }

/* Bloques de contenido */
.bloque { position: relative; padding: 18px 20px 18px 22px; border-left: 5px solid var(--bc, var(--mar)); box-shadow: 0 6px 18px rgba(11,42,102,.06); }
.bloque-cab { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.bloque-cab h3 { margin: 2px 0 0; }
.bloque-ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--bc, var(--mar)); box-shadow: 0 6px 14px color-mix(in srgb, var(--bc, var(--mar)) 35%, transparent); }
.bloque.caso { --bc: #e3a805; } .bloque.psicologia { --bc: #0f4c9c; } .bloque.ejercicio { --bc: #1f9e8f; } .bloque.recuerde { --bc: #c8553d; }
.bloque.enlace, .bloque.video, .bloque.imagen { --bc: #6c4ab6; }
.bloque.enlace .bloque-cab { margin: 0; }
.bloque-txt { padding-left: 52px; }
.pop-btn { display: inline-flex; gap: 6px; align-items: center; animation: latido 2.8s ease-in-out infinite; }
@keyframes latido { 0%, 100% { box-shadow: 0 6px 14px rgba(227,181,5,.35); } 50% { box-shadow: 0 6px 22px rgba(227,181,5,.6), 0 0 0 6px rgba(227,181,5,.12); } }

/* Resultado y confeti */
.resultado { position: relative; overflow: hidden; }
.confeti { position: absolute; inset: 0; pointer-events: none; }
.confeti i { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: caer 2.6s ease-in forwards; opacity: .9; }
@keyframes caer { to { top: 110%; transform: rotate(540deg) translateX(30px); opacity: 0; } }

/* Me gusta */
.like .ic { transition: transform .2s ease; }
.like.on .ic { fill: var(--ladrillo); }
.like.pop .ic { animation: corazon .45s ease; }
@keyframes corazon { 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

/* Estados vacíos */
.burbuja-ico { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 20px; display: grid !important; place-items: center; background: var(--suave); color: var(--mar); font-size: 1.8rem; }

/* =================== Guías interactivas =================== */
.mb { margin-bottom: 16px; }
.bloque.cuestionario { --bc: #6c4ab6; background: linear-gradient(135deg, color-mix(in srgb, #6c4ab6 7%, var(--papel)), var(--papel)); }
.bloque-txt table { display: block; overflow-x: auto; border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .9rem; }
.bloque-txt th { background: var(--suave); text-align: left; padding: 8px 10px; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-2); }
.bloque-txt td { border-top: 1px solid var(--linea); padding: 8px 10px; vertical-align: top; min-width: 140px; }
.bloque-txt ul { margin: .4em 0; padding-left: 1.2em; }
.bloque-txt li { margin-bottom: .3em; }
.bloque-img { margin: 12px 0 0; }
.bloque-img img { width: 100%; max-height: 520px; object-fit: contain; border-radius: 14px; background: var(--suave); }
.bloque-img figcaption { font-size: .82rem; color: var(--tinta-2); margin-top: 6px; text-align: center; }
.video-marco { position: relative; padding-top: 56.25%; border-radius: 14px; overflow: hidden; margin-top: 12px; background: #000; }
.video-marco iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-archivo { width: 100%; border-radius: 14px; margin-top: 12px; }
.ejercicio-form { margin-top: 14px; padding: 16px; border-radius: 14px; background: var(--papel); border: 1.5px dashed color-mix(in srgb, var(--bc) 45%, transparent); }
.ejercicio-form .campo > span { font-weight: 700; color: var(--tinta); }
.ejercicio-form textarea { min-height: 60px; }
.ej-vista { margin-top: 12px; display: grid; gap: 6px; }
.ej-campo-vista { padding: 8px 12px; border-radius: 10px; background: var(--papel); border: 1px dashed var(--linea); font-size: .88rem; color: var(--tinta-2); }
.portada-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sesion-head img.fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.portada-editor { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
.portada-prev { height: 124px; border-radius: 14px; overflow: hidden; background: var(--suave); }
.portada-prev .escena, .portada-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ed-num { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 9px; background: var(--navy); color: #fff; font-weight: 800; font-size: .82rem; flex: none; }
.ed-mini img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; }
.pasos-papel { display: grid; gap: 14px; margin-top: 10px; }
.paso-papel { display: flex; gap: 14px; padding: 16px; border-radius: 16px; background: var(--fondo); border: 1px solid var(--linea); }
.paso-papel > div { flex: 1; min-width: 0; }
.paso-papel p { margin: 4px 0 10px; }
.perfil-card { border-top: 4px solid var(--c); }
.permisos-mini { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.permisos-mini span { width: 14px; height: 14px; border-radius: 4px; background: var(--suave); }
.permisos-mini span.on { background: var(--c); }
.lista-permisos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.permiso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--linea); cursor: pointer; font-size: .9rem; }
.permiso:has(input:checked) { border-color: var(--mar); background: var(--suave); }
.permiso input { width: 18px; height: 18px; accent-color: var(--navy); flex: none; margin-top: 2px; }

/* Navegación inferior móvil */
.nav-movil { display: none; }
@media (max-width: 900px) {
  .login { grid-template-columns: 1fr; }
  .login-hero { padding: 28px 20px 40px; min-height: auto; }
  .hero-ilus { display: none; }
  .hero-titulo { margin-top: 18px; }
  .shell { grid-template-columns: 1fr; }
  .lateral { display: none; }
  .barra { padding: 10px 16px; }
  .contenido { padding: 16px 16px 96px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .g4.kpis { grid-template-columns: repeat(2, 1fr); }
  .hola { grid-template-columns: 1fr; padding: 22px; }
  .hola .ilus { display: none; }
  .chat { grid-template-columns: 1fr; height: calc(100vh - 170px); }
  .chat.con-hilo .chat-lista { display: none; }
  .chat:not(.con-hilo) .chat-panel { display: none; }
  .nav-movil {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--papel); border-top: 1px solid var(--linea);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; box-shadow: 0 -6px 20px rgba(0,0,0,.06);
  }
  .nav-movil button { border: 0; background: none; color: var(--tinta-2); font-size: .66rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 6px; border-radius: 12px; min-width: 56px; position: relative; }
  .nav-movil button .ico { font-size: 1.3rem; }
  .nav-movil button.activo { color: var(--mar); }
  .nav-movil .badge { position: absolute; top: 0; right: 8px; background: var(--ladrillo); color: #fff; border-radius: 999px; font-size: .62rem; padding: 0 5px; }
  .burbuja { max-width: 88%; }
  .ruta { grid-auto-columns: 74%; }
  .portada-editor, .lista-permisos { grid-template-columns: 1fr; }

  ['Piensa lento cuando decides.', 'Compara, revisa y pregunta antes de elegir. (Kahneman, 2011)'],
  ['Puedes lograrlo.', 'Recuerda algo difícil que ya conseguiste: esa es tu prueba. (Bandura, 1977)'],
  ['Si… entonces…', 'Anticipar obstáculos hace que tus metas se cumplan. (Gollwitzer, 1999)']
];

/** Reduce la imagen (máx. lado en px) y la convierte a WEBP/JPEG liviano antes de subirla. */
function comprimirImagen(file, max, calidad) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, (max || 1400) / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let d = cv.toDataURL('image/webp', calidad || .8);
      if (!/^data:image\/webp/.test(d)) d = cv.toDataURL('image/jpeg', calidad || .8);
      res({ mime: d.slice(5, d.indexOf(';')), base64: d.split(',')[1], nombre: file.name.replace(/\.[^.]+$/, '') + (/webp/.test(d) ? '.webp' : '.jpg') });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
/** <img> para una referencia: URL https directa o "drive:ID" (se resuelve después con cargarImagenes). */
function imgRef(ref, alt, clase) {
  if (!ref) return '';
  if (/^drive:/.test(ref)) return `<img class="${clase || ''}" data-img="${h(ref)}" alt="${h(alt || '')}" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">`;
  return `<img class="${clase || ''}" src="${h(ref)}" alt="${h(alt || '')}" loading="lazy">`;
}
async function cargarImagenes(raiz) {

  for (let i = 0; i < faltan.length; i += 12) {

    } catch (e) {}

}

    ${m.propio || esAdminC() ? `<button class="btn mini fantasma" data-delmat="${m.id}" title="Eliminar">🗑️</button>` : ''}</div></div>`).join('')}</div>`;

function activarMateriales(c) {
  $$('[data-arch]', c).forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    try {
      const f = await api('archivoMaterial', { id: b.dataset.arch });
      const bytes = Uint8Array.from(atob(f.base64), ch => ch.charCodeAt(0));
      const blob = new Blob([bytes], { type: f.mime });
      if (/pdf|image|video|text/.test(f.mime)) { const w = window.open(URL.createObjectURL(blob), '_blank'); if (!w) descargar(f.nombre, blob); }
      else descargar(f.nombre, blob);
    } catch (e) { toast(e.message, true); }
    b.disabled = false; b.textContent = 'Abrir';
  });
  $$('[data-delmat]', c).forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este material?')) return;
    try { await api('eliminarMaterial', { id: b.dataset.delmat }); toast('Material eliminado'); ir(E.vista, E.params); } catch (e) { toast(e.message, true); }
  });
}

/** Video desde YouTube, Google Drive (compartido con el enlace) o un archivo .mp4. */
function videoHTML(url, titulo) {
  const u = String(url || '');
  const yt = u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if (yt) return `<div class="video-marco"><iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}" title="${h(titulo)}" allowfullscreen loading="lazy"></iframe></div>`;
  const dr = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (dr) return `<div class="video-marco"><iframe src="https://drive.google.com/file/d/${dr[1]}/preview" title="${h(titulo)}" allow="autoplay" loading="lazy"></iframe></div>`;
  if (/\.(mp4|webm)(\?|$)/i.test(u)) return `<video class="video-archivo" src="${h(u)}" controls preload="none"></video>`;
  return u ? `<a class="btn mini sec" href="${h(u)}" target="_blank" rel="noopener">Ver video ↗</a>` : '';
}
/** Imagen y/o video que acompañan cualquier paso de la guía. */
function mediaBloque(b) {
  let out = '';
  if (b.img) out += `<figure class="bloque-img">${imgRef(b.img, b.pie || b.titulo)}${b.pie ? `<figcaption>${h(b.pie)}</figcaption>` : ''}</figure>`;
  if (b.video) out += videoHTML(b.video, b.titulo);

}
/**
 * Un paso de la guía. ctx = { s, trabajos (por bloque), cuestionarios (por código), pers }.
 * Los ejercicios se responden aquí mismo; las encuestas muestran "Responder" o "Ver mi resultado".
 */
function renderBloque(b, i, ctx) {
  ctx = ctx || {};
  const id = b.id || 'b' + i;
  const [, etq, icono] = BLOQUE[b.tipo] || BLOQUE.texto;
  const cab = `<div class="bloque-cab"><span class="bloque-ico">${ic(icono, 20)}</span><div><div class="etq">${etq}</div>${b.titulo ? `<h3>${h(b.titulo)}</h3>` : ''}</div></div>`;
  const txt = b.texto && !['enlace', 'video', 'imagen'].includes(b.tipo) ? `<div class="bloque-txt">${sanear(b.texto)}</div>` : '';
  if (b.tipo === 'enlace') return `<div class="bloque enlace"><div class="fila entre">${cab}<a class="btn mini oro" href="${h(b.texto || b.url)}" target="_blank" rel="noopener">Abrir sitio ${ic('flecha', 15)}</a></div>${mediaBloque(b)}</div>`;
  if (b.tipo === 'video') return `<div class="bloque video">${cab}${videoHTML(b.video || b.texto || b.url, b.titulo)}</div>`;
  if (b.tipo === 'imagen') return `<div class="bloque imagen">${cab}<figure class="bloque-img">${imgRef(b.img || b.texto || b.url, b.titulo)}${b.pie ? `<figcaption>${h(b.pie)}</figcaption>` : ''}</figure></div>`;
  if (b.tipo === 'cuestionario') {
    const q = (ctx.cuestionarios || {})[b.codigo];
    let acc;
    if (ctx.pers) acc = q ? `<span class="chip ${q.habilitado ? 'ok' : ''}">${q.habilitado ? 'Habilitado: ' + h(q.cursos || 'todos los cursos') : 'No habilitado'}</span><button class="btn mini sec" data-q="${q.id}">Vista previa</button><button class="btn mini sec" onclick="ir('cuestionarios')">Gestionar</button>` : `<span class="chip alerta">No existe un cuestionario con código ${h(b.codigo)}</span>`;
    else if (!q) acc = `<span class="chip">${ic('reloj', 14)} Aún no está habilitada: su profesor/a le avisará</span>`;
    else if (q.respondido) acc = `<span class="chip ok">${ic('check', 14)} Ya respondida</span><button class="btn mini oro" data-resq="${h(q.codigo)}">${ic('grafico', 15)} Ver mi resultado</button><button class="btn mini sec" data-q="${q.id}">Revisar respuestas</button>`;
    else acc = `<button class="btn oro" data-q="${q.id}">${ic('tarea', 16)} Responder ahora</button>`;
    return `<div class="bloque cuestionario">${cab}${txt}${mediaBloque(b)}<div class="fila mt">${acc}</div></div>`;
  }
  if (b.tipo === 'ejercicio') {
    const campos = b.campos || [];
    let zona;
    if (ctx.pers) {
      zona = `<div class="ej-vista">${campos.map(x => `<div class="ej-campo-vista">${h(x)}</div>`).join('') || '<div class="ej-campo-vista">Respuesta libre</div>'}
        <p class="muted peq">${ic('lapiz', 14)} Los alumnos y familias responden aquí${b.foto ? ' (pueden subir foto)' : ''}. Vea sus respuestas en <b>Reporte de la sesión</b>.</p></div>`;
    } else if (ctx.puedeEj) {
      const t = (ctx.trabajos || {})[id] || { campos: {} };
      zona = `<form class="ejercicio-form" data-ej="${h(id)}">
        ${campos.length ? campos.map((x, j) => `<label class="campo"><span>${h(x)}</span><textarea class="input" name="c${j}" rows="2" maxlength="3000">${h(t.campos['c' + j] || '')}</textarea></label>`).join('')
          : `<label class="campo"><span>Mi respuesta</span><textarea class="input" name="texto" maxlength="8000">${h(t.texto || '')}</textarea></label>`}
        <div class="fila"><label class="btn mini sec">${ic('imagen', 15)} ${t.tieneImagen ? 'Cambiar foto' : b.foto ? 'Subir foto de mi dibujo' : 'Agregar foto (opcional)'}<input type="file" accept="image/*" name="foto" hidden></label>
          ${t.tieneImagen ? `<button type="button" class="btn mini fantasma" data-verfoto="${h(t.id)}">Ver mi foto</button>` : ''}<span class="foto-nombre muted peq"></span>
          <span style="flex:1"></span><span class="muted peq estado-ej">${t.fecha ? ic('check', 14) + ' Guardado ' + fecha(t.fecha) : ''}</span><button class="btn mini oro">${ic('check', 15)} Guardar</button></div></form>`;
    } else zona = '';
    return `<div class="bloque ejercicio">${cab}${txt}${mediaBloque(b)}${zona}</div>`;
  }
  return `<div class="bloque ${h(b.tipo)}">${cab}${txt}${mediaBloque(b)}</div>`;
}

    } catch (e) { toast(e.message, true); }
  });

/** Permite solo etiquetas de formato básicas (y tablas) en los textos de sesiones. */
function sanear(html) {
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const permit = ['B', 'I', 'EM', 'STRONG', 'BR', 'P', 'UL', 'OL', 'LI', 'U', 'SMALL', 'A', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'H4', 'BLOCKQUOTE'];
  const limpiar = n => Array.from(n.childNodes).forEach(x => {
    if (x.nodeType === 1) {
      if (!permit.includes(x.tagName)) { x.replaceWith(document.createTextNode(x.textContent)); return; }
      Array.from(x.attributes).forEach(a => { if (!(x.tagName === 'A' && a.name === 'href' && /^https:/i.test(a.value))) x.removeAttribute(a.name); });
      if (x.tagName === 'A') { x.setAttribute('target', '_blank'); x.setAttribute('rel', 'noopener'); }
      limpiar(x);
    }
  });
  limpiar(t.content); return t.innerHTML;
}

}

/** Lee la primera hoja de un .xlsx o un .csv (separado por ; o ,) como lista de objetos. */
async function leerPlanilla(file, crudo) {
  await cargarXLSX();
  let wb;
  if (/\.csv$/i.test(file.name)) {
    const texto = (await file.text()).replace(/^﻿/, '');
    const linea = texto.split(/\r?\n/)[0] || '';
    wb = XLSX.read(texto, { type: 'string', FS: linea.split(';').length > linea.split(',').length ? ';' : ',', raw: !!crudo });
  } else wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: !!crudo });
}

/**

  const m = await api('matrizCuestionario', { id });
  const c = modal(`<h2>${ic('subir', 22)} Cargar resultados en papel</h2><p class="muted"><span class="chip">${h(m.codigo)}</span> ${h(m.titulo)}</p>

        <p class="peq" style="color:var(--alerta)">${ic('escudo', 14)} Son datos de menores de edad: use una IA institucional con acuerdo de tratamiento de datos o cubra los nombres antes de enviar las imágenes (Ley 21.719).</p></div></div>
      <div class="paso-papel"><span class="ed-num">3</span><div><b>Revise y suba la matriz completada</b><p class="muted peq">Verifique las celdas dudosas que le indique la IA. Acepta .xlsx o .csv.</p>
        <label class="fila peq"><input type="checkbox" id="pSobre"> Reemplazar respuestas ya registradas de esas personas</label>
        <div class="drop mt" id="pDrop">Arrastre el archivo aquí o <label style="color:var(--mar);cursor:pointer;font-weight:700">elíjalo<input type="file" id="pFile" accept=".xlsx,.xls,.csv" hidden></label></div><div id="pRes" class="mt"></div></div></div>
    </div>`, true);
  $('#pDesc', c).onclick = async () => {
    try {
      await cargarXLSX();
      const ws = XLSX.utils.aoa_to_sheet([m.columnas.map(x => x.titulo)]);
      ws['!cols'] = m.columnas.map(x => ({ wch: Math.min(40, Math.max(12, x.titulo.length * .6)) }));
      const ins = XLSX.utils.aoa_to_sheet([['Columna', 'Qué escribir']].concat(m.columnas.map(x => [x.titulo, x.ayuda])).concat([[], ['Instrucciones para la IA'], [m.instruccionesIA]]));
      ins['!cols'] = [{ wch: 60 }, { wch: 70 }];
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Respuestas'); XLSX.utils.book_append_sheet(wb, ins, 'Instrucciones');
      XLSX.writeFile(wb, `matriz_${m.codigo}.xlsx`);
    } catch (e) { toast(e.message, true); }
  };
  $('#pCopiar', c).onclick = () => copiarTexto(m.instruccionesIA, 'Instrucciones copiadas');
  $('#pTxt', c).onclick = () => descargar(`instrucciones_IA_${m.codigo}.txt`, m.instruccionesIA);
  const procesar = async file => {
    const res = $('#pRes', c); res.innerHTML = cargando('Leyendo la matriz…');
    try {
      const filas = await leerPlanilla(file, false);
      if (!filas.length) throw new Error('La matriz no tiene filas.');
      res.innerHTML = cargando(`Registrando ${filas.length} encuesta(s)…`);
      const tot = { nuevas: 0, actualizadas: 0, omitidas: 0, errores: [] };
      for (let i = 0; i < filas.length; i += 80) {
        const r = await api('importarResultados', { id, filas: filas.slice(i, i + 80), sobrescribir: $('#pSobre', c).checked });
        tot.nuevas += r.nuevas; tot.actualizadas += r.actualizadas; tot.omitidas += r.omitidas;
        tot.errores.push(...r.errores.map(e => e.replace(/Fila (\d+)/, (x, n) => 'Fila ' + (Number(n) + i))));

  drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('sobre'); if (e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]); };
}

function renderPregunta(p, v) {
  const nombre = 'p_' + p.id;
  let cuerpo = '';
  if (p.tipo === 'likert' || p.tipo === 'unica') cuerpo = `<div class="opciones" role="radiogroup">${p.opciones.map(o => `<label class="opcion"><input type="radio" name="${nombre}" value="${h(o)}" ${v === o ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
  else if (p.tipo === 'multiple') cuerpo = `<div class="opciones">${p.opciones.map(o => `<label class="opcion"><input type="checkbox" name="${nombre}" value="${h(o)}" ${(v || []).includes(o) ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
  else if (p.tipo === 'abierta') cuerpo = `<textarea class="input" name="${nombre}" maxlength="3000" placeholder="Escribe aquí…">${h(v || '')}</textarea>`;
  else if (p.tipo === 'escala') cuerpo = `<div class="tabla-wrap"><table class="escala"><thead><tr><th style="text-align:left">Actividad</th>${p.opciones.map(o => `<th>${h(o)}</th>`).join('')}</tr></thead><tbody>
    ${p.items.map((it, i) => `<tr><td>${i + 1}. ${h(it.texto)}</td>${p.opciones.map((o, j) => `<td class="o"><input type="radio" aria-label="${h(o)}" name="${nombre}_${it.id}" value="${j + 1}" ${v && String(v[it.id]) === String(j + 1) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  else if (p.tipo === 'pareo') cuerpo = p.items.map((it, i) => `<div class="fila" style="margin-bottom:10px;align-items:flex-start"><span style="flex:1;min-width:220px">${i + 1}. ${h(it.texto)}</span><select class="input" style="width:auto;min-width:220px" name="${nombre}_${it.id}"><option value="">Elige la trampa…</option>${p.opciones.map(o => `<option ${v && v[it.id] === o ? 'selected' : ''}>${h(o)}</option>`).join('')}</select></div>`).join('');
  else if (p.tipo === 'pasos') cuerpo = Array.from({ length: p.pasos || 3 }, (_, i) => `<div class="grid" style="grid-template-columns:1fr 170px;gap:8px;margin-bottom:8px"><input class="input" name="${nombre}_texto${i + 1}" placeholder="Paso ${i + 1}: ¿qué voy a hacer?" value="${h(v ? v['texto' + (i + 1)] || '' : '')}"><input class="input" type="date" name="${nombre}_fecha${i + 1}" value="${h(v ? v['fecha' + (i + 1)] || '' : '')}"></div>`).join('');
  return `<fieldset class="pregunta" style="border:0;margin:0;padding-left:0;padding-right:0"><legend class="enun"><span class="n">${p.n}</span>${h(p.texto)}${p.obligatoria ? ' <span style="color:var(--ladrillo)">*</span>' : ''}</legend>${cuerpo}</fieldset>`;
}
function recogerRespuestas(preguntas, f) {
  const r = {};
  preguntas.forEach(p => {
    const n = 'p_' + p.id;
    if (p.tipo === 'likert' || p.tipo === 'unica') { const x = f.querySelector(`input[name="${n}"]:checked`); if (x) r[p.id] = x.value; }
    else if (p.tipo === 'multiple') r[p.id] = $$(`input[name="${n}"]:checked`, f).map(x => x.value);
    else if (p.tipo === 'abierta') { const t = f.querySelector(`[name="${n}"]`).value.trim(); if (t) r[p.id] = t; }
    else if (p.tipo === 'escala') { const o = {}; p.items.forEach(it => { const x = f.querySelector(`input[name="${n}_${it.id}"]:checked`); if (x) o[it.id] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
    else if (p.tipo === 'pareo') { const o = {}; p.items.forEach(it => { const x = f.querySelector(`[name="${n}_${it.id}"]`); if (x && x.value) o[it.id] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
    else if (p.tipo === 'pasos') { const o = {}; $$(`[name^="${n}_"]`, f).forEach(x => { if (x.value) o[x.name.slice(n.length + 1)] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
  });
  return r;
}

}

/* =====================================================================

async function panelIA(cont, params, etiqueta) {
  cont.innerHTML = cargando('Buscando el análisis vigente…');
  const pintar = (a) => {
    const k = a.contenido || {};
    const lista = (t, ico, arr) => arr && arr.length ? `<h4>${ico} ${t}</h4><ul>${arr.map(x => `<li>${h(x)}</li>`).join('')}</ul>` : '';
    cont.innerHTML = `<div class="ia-card"><div class="fila entre"><h3 style="margin:0">✨ Análisis e interpretación ${params.tipo === 'curso' ? 'del curso' : 'individual'}</h3>
      <div class="fila no-print">${a.existe ? '' : '<button class="btn oro mini" data-gen>Generar análisis</button>'}${a.desactualizado ? '<button class="btn oro mini" data-gen>Actualizar con datos nuevos</button>' : ''}${a.existe && esAdminC() ? '<button class="btn fantasma mini" data-forzar title="Solo administración">↻ Regenerar</button>' : ''}</div></div>
      ${!a.existe ? `<p class="muted">Aún no se ha generado el análisis para ${h(etiqueta)}. Al generarlo, quedará guardado y <b>todo el equipo verá exactamente el mismo</b> mientras los datos no cambien.</p>` : `
      ${a.desactualizado ? '<p class="chip alerta">Hay respuestas nuevas desde este análisis. Actualícelo para incluirlas.</p>' : ''}
      ${k.nota ? `<p class="chip alerta">${h(k.nota)}</p>` : ''}
      <p style="font-size:1.02rem">${h(k.resumen)}</p>
      <div class="grid g2">${'<div>' + lista('Fortalezas', '🌟', k.fortalezas) + lista('Aspectos a desarrollar', '🧩', k.focos) + lista('Alertas', '⚠️', k.alertas) + '</div><div>' + lista('Recomendaciones para el equipo', '🧭', k.recomendaciones) + lista('Decisiones de orientación', '✅', k.decisiones) + '</div>'}</div>
      ${k.mensajeEstudiante ? `<h4>💬 Mensaje sugerido para el estudiante</h4><p class="tarjeta plana" style="margin:0">${h(k.mensajeEstudiante)}</p>` : ''}
      ${k.sugerenciasFamilia ? `<h4>🏡 Sugerencia para la familia</h4><p style="margin:0">${h(k.sugerenciasFamilia)}</p>` : ''}
      <div class="sello">🔏 Análisis único compartido · ${a.motor === 'reglas' ? 'Motor de reglas del manual' : 'IA: ' + h(a.motor.split(':')[1] || a.motor)} · versión ${h(a.version)} · generado por ${h(a.generadoPorNombre)} el ${h(a.fecha)}</div>`}</div>`;
    $$('[data-gen]', cont).forEach(b => b.onclick = () => cargar({ generar: true }));
    const f = $('[data-forzar]', cont); if (f) f.onclick = () => { if (confirm('¿Regenerar el análisis? Reemplazará la versión vigente para todo el equipo.')) cargar({ generar: true, forzar: true }); };
  };
  const cargar = async (extra) => {
    if (extra) cont.innerHTML = cargando('Analizando resultados… puede tardar unos segundos.');
    try { pintar(await api('analisis', Object.assign({}, params, extra || {}))); } catch (e) { cont.innerHTML = vacio('⚠️', h(e.message)); }
  };
  cargar();
}

  $('#bImpA').onclick = () => imprimir($('#repA'), 'Análisis del curso ' + E.cursoSel);

function graficosCursoHTML(d) {
  const resp = d.filas.filter(f => f.completados > 0).length;
  return `<div class="grid g4 kpis"><div class="tarjeta kpi"><span class="ico">🎒</span><b>${d.estudiantes}</b><span>estudiantes</span></div><div class="tarjeta kpi"><span class="ico">✍️</span><b>${resp}</b><span>con respuestas</span></div>
    <div class="tarjeta kpi"><span class="ico">⚠️</span><b>${d.alertas.length}</b><span>con alertas</span></div><div class="tarjeta kpi"><span class="ico">🎯</span><b>${d.certeza.e3 !== null ? d.certeza.e3.toFixed(1) : '—'}</b><span>certeza final promedio</span></div></div>
    <div class="grid g2 mt"><div class="tarjeta"><h3>Promedio por indicador</h3><div class="lienzo"><canvas id="gProm"></canvas></div></div>
    <div class="tarjeta"><h3>Distribución de niveles</h3><div class="lienzo"><canvas id="gDist"></canvas></div></div>
    <div class="tarjeta"><h3>Intereses predominantes (RIASEC)</h3><div class="lienzo"><canvas id="gRia"></canvas></div></div>
    <div class="tarjeta"><h3>¿Qué influye más en su decisión? (E1)</h3><div class="lienzo"><canvas id="gInf"></canvas></div></div>
    <div class="tarjeta"><h3>Modalidades que conocen (E1)</h3><div class="lienzo"><canvas id="gMod"></canvas></div></div>
    <div class="tarjeta"><h3>Participación por instrumento</h3><div class="lienzo"><canvas id="gPar"></canvas></div></div></div>
    ${d.alertas.length ? `<div class="tarjeta mt"><h3>⚠️ Estudiantes que requieren seguimiento</h3><div class="tabla-wrap"><table class="tabla">${d.alertas.map(a => `<tr><td><b>${h(a.nombre)}</b></td><td>${a.alertas.map(x => `<span class="chip alerta">${h(x)}</span>`).join(' ')}</td></tr>`).join('')}</table></div></div>` : ''}`;
}
function dibujarGraficosCurso(d) {
  graficar($('#gProm'), { type: 'bar', data: { labels: DIM.map(x => x[1]), datasets: [{ data: DIM.map(x => d.promedios[x[0]]), backgroundColor: ['#0b2a66', '#1f9e8f', '#e3b505', '#c8553d'], borderRadius: 10 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 4 } } } });
  const nv = ['No logrado', 'En desarrollo', 'Logrado', 'Logrado sólidamente'], cnv = ['#e8857e', '#f2b66d', '#7fcfa7', '#1f9e6b'];
  graficar($('#gDist'), { type: 'bar', data: { labels: DIM.map(x => x[1]), datasets: nv.map((n, i) => ({ label: n, data: DIM.map(x => d.distribucion[x[0]][i]), backgroundColor: cnv[i] })) }, options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { legend: { position: 'bottom' } } } });
  graficar($('#gRia'), { type: 'polarArea', data: { labels: 'RIASEC'.split('').map(l => l + ' ' + RIASEC_T[l]), datasets: [{ data: 'RIASEC'.split('').map(l => d.riasec[l]), backgroundColor: COLORES.map(x => x + 'cc') }] }, options: { plugins: { legend: { position: 'right' } } } });
  const inf = Object.keys(d.influencia);
  graficar($('#gInf'), { type: 'doughnut', data: { labels: inf.length ? inf : ['Sin datos'], datasets: [{ data: inf.length ? inf.map(k => d.influencia[k]) : [1], backgroundColor: inf.length ? COLORES : ['#e3e0d8'] }] }, options: { plugins: { legend: { position: 'right' } }, cutout: '58%' } });
  const mod = ['Científico-humanista', 'Técnico-profesional', 'Artística', 'No conozco ninguna'];
  graficar($('#gMod'), { type: 'bar', data: { labels: mod, datasets: [{ data: mod.map(m => d.modalidades[m] || 0), backgroundColor: '#0f4c9c', borderRadius: 8 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  const ins = ['E1', 'RIASEC', 'E2', 'TRAMPAS', 'E3', 'AUTONOMIA'];
  graficar($('#gPar'), { type: 'bar', data: { labels: ins, datasets: [{ label: 'Respondieron', data: ins.map(k => d.participacion[k] || 0), backgroundColor: '#e3b505', borderRadius: 8 }, { label: 'Total', data: ins.map(() => d.estudiantes), backgroundColor: '#e3e0d8', borderRadius: 8 }] }, options: { plugins: { legend: { position: 'bottom' } } } });
}

        ${t.respuestas.map(r => `<tr><td><b>${h(r.nombre)}</b><div class="muted peq">${h(r.quien)} · ${fecha(r.fecha)}</div></td>${(t.campos.length ? t.campos.map((_, j) => r.campos['c' + j]) : [r.texto]).map(v => `<td class="peq" style="white-space:pre-wrap">${h(v || '—')}</td>`).join('')}

    (d.trabajos || []).forEach(t => t.respuestas.forEach(r => (t.campos.length ? t.campos : ['Respuesta']).forEach((cmp, j) => filas.push(['Ejercicio: ' + t.titulo, r.nombre, r.quien, r.fecha, cmp, t.campos.length ? (r.campos['c' + j] || '') : r.texto, r.tieneImagen ? 'con foto' : '']))));

VISTAS.usuarios = async (c, p) => {
  const f = Object.assign({ rol: '', q: '', curso: '' }, p);
  const cursos = await misCursos();
  const [us, pf] = await Promise.all([api('usuarios', f), api('perfiles')]);
  const nomPerfil = {}; pf.perfiles.forEach(x => { nomPerfil[x.id] = x.nombre; });
  const etiquetaRol = u => u.rol === 'personalizado' ? 'Funcionario · ' + (nomPerfil[u.perfilId] || 'perfil') : ROL_TXT[u.rol];
  c.innerHTML = `<div class="fila entre"><div class="fila"><input class="input" id="uQ" placeholder="Buscar por nombre o RUT" value="${h(f.q)}" style="width:230px">
      <select class="input" id="uRol" style="width:auto"><option value="">Todos los perfiles</option>${Object.keys(ROL_TXT).map(r => `<option value="${r}" ${f.rol === r ? 'selected' : ''}>${r === 'personalizado' ? 'Funcionario · perfiles creados' : ROL_TXT[r]}</option>`).join('')}</select>
      <select class="input" id="uCur" style="width:auto"><option value="">Todos los cursos</option>${cursos.map(x => `<option ${f.curso === x.curso ? 'selected' : ''}>${h(x.curso)}</option>`).join('')}</select><button class="btn sec" id="uFil">Filtrar</button></div>
    <div class="fila"><button class="btn sec" id="bApo">＋ Adulto responsable extra</button><button class="btn oro" id="bNuevoU">＋ Funcionario</button></div></div>
    <p class="muted peq mt">${us.length} cuenta(s). Las claves nunca se muestran: solo pueden restablecerse.</p>
    <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Nombre</th><th>RUT</th><th>Rol</th><th>Curso(s)</th><th>Estado</th><th>Último acceso</th><th></th></tr></thead><tbody>
    ${us.slice(0, 400).map(u => `<tr><td><b>${h(u.nombre)}</b>${u.estudianteNombre && u.rol === 'apoderado' ? `<div class="muted peq">${h(u.parentesco)} de ${h(u.estudianteNombre)}</div>` : ''}</td><td class="peq">${h(u.rut)}</td><td><span class="chip ${u.rol === 'admin' ? 'oro' : u.rol === 'apoderado' ? 'violeta' : ''}">${h(etiquetaRol(u))}</span></td>
      <td class="peq">${h(u.curso || u.cursos || '—')}</td><td>${u.activo ? '<span class="chip ok">Activo</span>' : '<span class="chip peligro">Inactivo</span>'}${u.debeCambiar ? ' <span class="chip">Clave inicial</span>' : ''}</td><td class="peq">${h(u.ultimoAcceso || '—')}</td>
      <td class="fila"><button class="btn mini sec" data-ed='${h(JSON.stringify(u))}'>Editar</button><button class="btn mini sec" data-rc="${h(u.id)}">Restablecer clave</button><button class="btn mini fantasma" data-del="${h(u.id)}" title="Eliminar cuenta">🗑️</button>${u.rol === 'estudiante' ? `<button class="btn mini peligro" data-sup="${h(u.rut)}" title="Derecho de supresión">Suprimir datos</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  const filtrar = () => ir('usuarios', { q: $('#uQ').value, rol: $('#uRol').value, curso: $('#uCur').value });
  $('#uFil').onclick = filtrar; $('#uQ').onkeydown = e => { if (e.key === 'Enter') filtrar(); };
  $('#bNuevoU').onclick = () => formUsuario(null, cursos, pf.perfiles);
  $('#bApo').onclick = () => formApoderado();
  $$('[data-ed]', c).forEach(b => b.onclick = () => formUsuario(JSON.parse(b.dataset.ed), cursos, pf.perfiles));
  $$('[data-rc]', c).forEach(b => b.onclick = async () => {
    if (!confirm('¿Restablecer la clave de esta cuenta? Estudiantes y familias vuelven a la fecha de nacimiento del estudiante.')) return;
    try { const r = await api('restablecerClave', { id: b.dataset.rc }); r.claveTemporal ? modal(`<h2>Clave temporal</h2><p>Entregue esta clave de forma privada. Se pedirá cambiarla al ingresar.</p><p class="display" style="font-size:2rem;text-align:center">${h(r.claveTemporal)}</p>`) : toast('Clave restablecida a la fecha de nacimiento (DDMMAAAA)'); } catch (e) { toast(e.message, true); }
  });
  $$('[data-sup]', c).forEach(b => b.onclick = async () => {
    if (prompt('Se eliminarán el estudiante, las cuentas de su familia, sus respuestas, mensajes, retroalimentación y análisis. No se puede deshacer. Escriba SUPRIMIR para confirmar.') !== 'SUPRIMIR') return;
    try { await api('eliminarEstudiante', { rut: b.dataset.sup }); E._cursos = null; toast('Datos del estudiante suprimidos'); filtrar(); } catch (e) { toast(e.message, true); }
  });
  $$('[data-del]', c).forEach(b => b.onclick = async () => { if (!confirm('¿Eliminar definitivamente esta cuenta?')) return; try { await api('eliminarUsuario', { id: b.dataset.del }); toast('Cuenta eliminada'); filtrar(); } catch (e) { toast(e.message, true); } });
};
function formUsuario(u, cursos, perfiles) {
  const personal = !u || ['admin', 'docente', 'asistente', 'personalizado'].includes(u.rol);
  const opciones = (perfiles || []).filter(x => x.base === 'funcionario').map(x => [x.sistema ? x.id : 'perfil:' + x.id, x.nombre]);
  const actual = u ? (u.perfilClave || u.rol) : 'docente';
  const c = modal(`<h2>${u ? 'Editar cuenta' : 'Nuevo integrante del equipo'}</h2>
    ${!u ? '<label class="campo"><span>RUT</span><input class="input" id="fRut" placeholder="12.345.678-9"></label>' : `<p class="muted">${h(u.rut)} · ${h(rolTexto(u))}</p>`}
    <label class="campo"><span>Nombre completo</span><input class="input" id="fNom" value="${h(u ? u.nombre : '')}"></label>
    ${personal ? `<label class="campo"><span>Perfil de funcionario</span><select class="input" id="fRol">${opciones.map(o => `<option value="${h(o[0])}" ${actual === o[0] ? 'selected' : ''}>${h(o[1])}</option>`).join('')}</select><small>Los permisos de cada perfil se definen en <b>Perfiles y permisos</b>.</small></label>
    <label class="campo"><span>Cursos asignados</span><select class="input" id="fCur" multiple size="${Math.min(8, cursos.length || 2)}">${cursos.map(x => `<option ${u && (u.cursos || '').split(/[,;]/).map(s => s.trim()).includes(x.curso) ? 'selected' : ''}>${h(x.curso)}</option>`).join('')}</select><small>También puede escribirlos: <input class="input mt" id="fCurTxt" placeholder="8° A, 8° B" value="${h(u ? u.cursos : '')}"></small></label>
    <label class="campo"><span>Correo (opcional)</span><input class="input" id="fMail" type="email" value="${h(u ? u.email : '')}"></label>` : ''}
    ${u ? `<label class="fila"><input type="checkbox" id="fAct" ${u.activo ? 'checked' : ''}> Cuenta activa</label>` : ''}
    <div class="fila mt"><button class="btn oro" id="bGU">Guardar</button><button class="btn fantasma" data-cerrar>Cancelar</button></div>`);
  if ($('#fCur', c)) $('#fCur', c).onchange = e => { $('#fCurTxt', c).value = Array.from(e.target.selectedOptions).map(o => o.value).join(', '); };
  $('#bGU', c).onclick = async () => {
    const d = { id: u && u.id, nombre: $('#fNom', c).value };
    if (!u) d.rut = $('#fRut', c).value;
    if ($('#fRol', c)) Object.assign(d, { rol: $('#fRol', c).value, cursos: $('#fCurTxt', c).value, email: $('#fMail', c).value });
    if ($('#fAct', c)) d.activo = $('#fAct', c).checked;
    try {
      const r = await api('guardarUsuario', d); E._cursos = null;
      if (r.claveTemporal) modal(`<h2>Cuenta creada</h2><p>Entregue al usuario su RUT y esta <b>clave temporal</b> de forma privada. Deberá cambiarla en su primer ingreso.</p><p class="display" style="font-size:2rem;text-align:center">${h(r.claveTemporal)}</p><button class="btn oro" data-cerrar onclick="ir('usuarios')">Listo</button>`);
      else { cerrarModal(); toast('Cuenta guardada'); ir('usuarios'); }
    } catch (e) { toast(e.message, true); }
  };
}
function formApoderado() {
  const c = modal(`<h2>Acceso adicional para adulto responsable</h2><p class="muted">Úselo cuando el tutor no es padre ni madre, o para crear un acceso que faltó. Ingresará con el RUT y la fecha de nacimiento del estudiante.</p>
    <label class="campo"><span>RUT del estudiante</span><input class="input" id="aRut"></label>
    <label class="campo"><span>Nombre del apoderado/a</span><input class="input" id="aNom"></label>
    <label class="campo"><span>Acceso como</span><select class="input" id="aPar"><option value="tutor">Tutor/a</option><option value="madre">Madre</option><option value="padre">Padre</option></select></label>
    <div class="fila mt"><button class="btn oro" id="bGA">Crear acceso</button><button class="btn fantasma" data-cerrar>Cancelar</button></div>`);
  $('#bGA', c).onclick = async () => { try { await api('guardarUsuario', { rol: 'apoderado', estudianteRut: $('#aRut', c).value, nombre: $('#aNom', c).value, parentesco: $('#aPar', c).value }); cerrarModal(); toast('Acceso creado'); ir('usuarios'); } catch (e) { toast(e.message, true); } };

      <label class="campo"><span>Descripción (opcional)</span><textarea class="input" id="cDes" style="min-height:60px">${h(x ? x.descripcion || '' : '')}</textarea></label>

      try { await api('guardarCurso', { original: x && x.registrado ? x.curso : '', curso: $('#cNom', m).value, nivel: $('#cNiv', m).value, profesorJefe: $('#cPJ', m).value, descripcion: $('#cDes', m).value }); cerrarModal(); toast('Curso guardado'); ir('gestionCursos'); }

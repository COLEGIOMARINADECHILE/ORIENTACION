      <ul class="peq mt"><li>Se crea una cuenta para el <b>estudiante</b>, la <b>madre</b> y el <b>padre</b> (si vienen sus nombres), cada una con clave independiente = fecha de nacimiento del estudiante (DDMMAAAA).</li>
      <li>Si el <b>tutor</b> no es ni el padre ni la madre, se crea un acceso adicional de tutor.</li>
      <li>Si el estudiante ya existe, se actualizan sus datos sin cambiar claves.</li></ul>
      <button class="btn sec mini" id="bPlantilla">⬇️ Descargar plantilla Excel</button></div>
    <div class="tarjeta"><div class="drop" id="drop">Arrastre el archivo aquí o <label style="color:var(--mar);cursor:pointer;font-weight:700">elíjalo<input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden></label></div><div id="prev" class="mt"></div></div></div>`;
  $('#bPlantilla').onclick = async () => {
    await cargarXLSX();
    const ws = XLSX.utils.aoa_to_sheet([COLUMNAS, ['12345678', '5', 'Nombre Apellido Apellido', 'F', '05-03-2012', '8° A', 'Concepción', '01-03-2026', 'Calle 123', 'Concepción', 'Nombre del padre', 'Nombre de la madre', '']]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Estudiantes'); XLSX.writeFile(wb, 'plantilla_carga_estudiantes.xlsx');
  };
  const procesar = async (file) => {
    const filas = await leerPlanilla(file, true);
    if (!filas.length) return toast('El archivo no tiene filas.', true);
    const faltan = ['Rut', 'DV', 'NombreAlumno', 'FechaNac', 'Curso'].filter(k => !Object.keys(filas[0]).some(x => x.replace(/\s/g, '').toLowerCase() === k.replace(/\s/g, '').toLowerCase()));
    const cursos = {}; filas.forEach(f => { const k = f.Curso || f.curso; cursos[k] = (cursos[k] || 0) + 1; });
    $('#prev').innerHTML = `<h3>${filas.length} filas · ${Object.keys(cursos).length} curso(s)</h3>
      ${faltan.length ? `<p class="chip peligro">Faltan columnas: ${faltan.join(', ')}</p>` : ''}
      <div class="fila">${Object.keys(cursos).map(k => `<span class="chip">${h(k)}: ${cursos[k]}</span>`).join('')}</div>
      <div class="tabla-wrap mt" style="max-height:220px"><table class="tabla"><tr>${Object.keys(filas[0]).slice(0, 7).map(k => `<th>${h(k)}</th>`).join('')}</tr>${filas.slice(0, 5).map(f => `<tr>${Object.keys(filas[0]).slice(0, 7).map(k => `<td class="peq">${h(f[k])}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="progreso mt"><div id="pb" style="width:0"></div></div><p id="pst" class="muted peq"></p>
      <button class="btn oro" id="bImportar" ${faltan.length ? 'disabled' : ''}>Importar ${filas.length} estudiantes</button>`;
    $('#bImportar').onclick = async ev => {
      ev.target.disabled = true;
      const tot = { creados: 0, actualizados: 0, cuentas: 0, errores: [] };
      const lote = 60;
      for (let i = 0; i < filas.length; i += lote) {
        $('#pst').textContent = `Procesando ${Math.min(i + lote, filas.length)} de ${filas.length}…`;
        try {
          const r = await api('importar', { filas: filas.slice(i, i + lote) });
          tot.creados += r.creados; tot.actualizados += r.actualizados; tot.cuentas += r.cuentas;
          tot.errores.push(...r.errores.map(e => e.replace(/Fila (\d+)/, (m, n) => 'Fila ' + (Number(n) + i))));
        } catch (e) { tot.errores.push(`Lote ${i / lote + 1}: ${e.message}`); }
        $('#pb').style.width = Math.round(100 * Math.min(i + lote, filas.length) / filas.length) + '%';
      }
      E._cursos = null;
      $('#pst').innerHTML = `<b>Listo:</b> ${tot.creados} nuevos, ${tot.actualizados} actualizados, ${tot.cuentas} cuentas creadas.${tot.errores.length ? `<br><span style="color:var(--peligro)">${tot.errores.length} fila(s) con problemas:</span><br>${tot.errores.slice(0, 30).map(h).join('<br>')}` : ''}`;
      toast('Importación terminada');
    };
  };
  $('#fx').onchange = e => e.target.files[0] && procesar(e.target.files[0]);
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('sobre'); };
  drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('sobre'); if (e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]); };
};

VISTAS.config = async (c) => {
  const k = await api('config');
  c.innerHTML = `<div class="grid g2"><div class="tarjeta"><h3>🏫 Institución</h3>
      ${[['nombreColegio', 'Nombre del colegio'], ['ciudad', 'Ciudad'], ['unidad', 'Unidad responsable'], ['anio', 'Año del proceso'], ['contactoPrivacidad', 'Correo de contacto para privacidad']].map(x => `<label class="campo"><span>${x[1]}</span><input class="input" data-k="${x[0]}" value="${h(k[x[0]])}"></label>`).join('')}
      <label class="campo"><span>${ic('enlace', 16)} Enlace de la plataforma (URL de la aplicación web)</span><input class="input" data-k="urlPlataforma" value="${h(k.urlPlataforma)}" placeholder="https://script.google.com/macros/s/…/exec">
        <small>Dirección del servidor en Apps Script. Si crea una implementación nueva con otra URL, cámbiela aquí y en el index.html de GitHub.</small></label>
      <label class="campo"><span>${ic('enlace', 16)} Dirección en GitHub Pages (opcional)</span><input class="input" data-k="urlGithub" value="${h(k.urlGithub)}" placeholder="https://usuario.github.io/repositorio/">
        <small>Si la completa, esa será la dirección para estudiantes y familias, y el enlace de Apps Script los enviará allá. Déjela vacía para seguir usando Apps Script.</small></label></div>
    <div class="tarjeta"><h3>🔒 Privacidad (Ley 21.719)</h3>
      <label class="fila campo"><input type="checkbox" data-k="apoderadoVeRetro" ${k.apoderadoVeRetro === 'true' ? 'checked' : ''}> Las familias ven toda la retroalimentación de su estudiante</label>
      <p class="muted peq">Si está desactivado, solo verán las retroalimentaciones que usted marque como visibles en cada reporte individual.</p>
      <label class="fila campo"><input type="checkbox" data-k="iaIncluirAbiertas" ${k.iaIncluirAbiertas === 'true' ? 'checked' : ''}> Incluir respuestas abiertas (depuradas) en el análisis IA</label>
      <label class="campo"><span>Meses de conservación de mensajes y auditoría</span><input class="input" type="number" min="6" data-k="retencionMeses" value="${h(k.retencionMeses)}"></label>
      <button class="btn sec mini" id="bDepurar">🧹 Aplicar política de conservación ahora</button>
      <h3 class="mt2">✨ Inteligencia artificial</h3>
      <p class="peq">${k.iaConfigurada ? `<span class="chip ok">Configurada · ${h(k.iaProveedor)}</span>` : '<span class="chip alerta">Sin clave de IA: se usa el motor de reglas del manual (determinista)</span>'}</p>
      <p class="muted peq">La clave se define en <b>Propiedades del script</b> (ANTHROPIC_API_KEY o GEMINI_API_KEY), nunca en el código ni en GitHub.</p></div>
    <div class="tarjeta"><h3>🖼️ Imágenes institucionales</h3><p class="muted peq">Se guardan en la carpeta privada de Drive y se reducen automáticamente para que la página cargue rápido.</p>
      ${[['img_logo', 'Insignia del colegio'], ['img_portada', 'Ilustración de portada (estudiantes)'], ['img_colegio', 'Fotografía del colegio (fondo del ingreso)']].map(x => `<div class="fila entre" style="margin-bottom:12px"><span>${x[1]}</span><label class="btn mini sec">Subir<input type="file" accept="image/*" data-imgcfg="${x[0]}" hidden></label></div>`).join('')}</div>
    <div class="tarjeta"><h3>📘 Contenido de los manuales</h3><p class="peq">Carga o actualiza en la plataforma el contenido completo de las guías (bienvenida, sesiones 1 a 7, manual de familias y guía docente) con sus ejercicios y encuestas.</p>
      <p class="muted peq">Solo se actualizan las sesiones que no han sido editadas. Las respuestas de estudiantes no se borran.</p>
      <div class="fila"><button class="btn sec mini" id="bContenido">${ic('libro', 15)} Actualizar contenido</button><button class="btn fantasma mini" id="bContenidoF">Reemplazar también las editadas</button></div>
      <h3 class="mt2">⚡ Velocidad</h3><p class="muted peq">La plataforma guarda una copia rápida de los datos por 30 minutos. Si editó la planilla directamente en Google Sheets, presione aquí para ver los cambios al instante.</p>
      <button class="btn sec mini" id="bRefrescar">${ic('reloj', 15)} Refrescar datos</button></div></div>
    <button class="btn oro mt" id="bGuardarCfg">Guardar configuración</button>`;
  $('#bGuardarCfg').onclick = async () => {
    const d = {}; $$('[data-k]', c).forEach(x => { d[x.dataset.k] = x.type === 'checkbox' ? String(x.checked) : x.value; });
    try { await api('guardarConfig', d); await cargarInfo(); toast('Configuración guardada'); } catch (e) { toast(e.message, true); }
  };
  $('#bDepurar').onclick = async () => { if (!confirm('Se eliminarán mensajes y registros de auditoría más antiguos que el plazo definido. ¿Continuar?')) return; try { const r = await api('depurar'); toast(`${r.borrados} registros eliminados (anteriores a ${r.limite})`); } catch (e) { toast(e.message, true); } };
  $$('[data-imgcfg]', c).forEach(x => x.onchange = async () => {
    const f = x.files[0]; if (!f) return;
    try {
      const max = x.dataset.imgcfg === 'img_logo' ? 360 : 900;
      const img = await comprimirImagen(f, max, x.dataset.imgcfg === 'img_colegio' ? .6 : .82);
      await api('subirImagen', Object.assign({ clave: x.dataset.imgcfg }, img)); local.del('infoPublica');
      await cargarInfo(); renderShell(); ir('config'); toast('Imagen actualizada');
    } catch (e) { toast(e.message, true); }
  });
  const contenido = async forzar => {
    if (forzar && !confirm('Se reemplazarán con el texto de los manuales también las sesiones que editó la administración. ¿Continuar?')) return;
    try { const r = await api('actualizarContenido', { forzar }); toast(`Listo: ${r.sesionesNuevas} sesiones nuevas, ${r.sesionesActualizadas} actualizadas, ${r.cuestionariosNuevos} cuestionarios nuevos`); } catch (e) { toast(e.message, true); }
  };
  $('#bContenido').onclick = () => contenido(false);
  $('#bContenidoF').onclick = () => contenido(true);
  $('#bRefrescar').onclick = async () => { try { await api('refrescar'); E._cursos = null; toast('Datos actualizados desde la planilla'); } catch (e) { toast(e.message, true); } };
};

VISTAS.auditoria = async (c) => {
  const a = await api('auditoria', { n: 400 });
  c.innerHTML = `<div class="fila entre"><p class="muted" style="margin:0">Registro de accesos y acciones (principio de responsabilidad, Ley 21.719). Últimos ${a.length} eventos.</p><button class="btn sec mini" id="bCsvAud">⬇️ CSV</button></div>
    <div class="tabla-wrap mt"><table class="tabla"><thead><tr><th>Fecha</th><th>Usuario</th><th>Rol</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
    ${a.map(x => `<tr><td class="peq">${h(x.fecha)}</td><td class="peq">${h(x.usuario)}</td><td>${h(x.rol)}</td><td><span class="chip ${/fallido|eliminar|suprimir/.test(x.accion) ? 'peligro' : ''}">${h(x.accion)}</span></td><td class="peq">${h(x.detalle)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#bCsvAud').onclick = () => descargar('auditoria.csv', csv([['Fecha', 'Usuario', 'Rol', 'Acción', 'Detalle']].concat(a.map(x => [x.fecha, x.usuario, x.rol, x.accion, x.detalle]))), 'text/csv;charset=utf-8');
};

/* =====================================================================
 * ARRANQUE
 * ===================================================================== */
(async function iniciar() {
  const tema = local.pget('tema', null); if (tema) document.documentElement.dataset.theme = tema;
  const t = local.get('token', null);
  // Velocidad: la portada se dibuja al instante con la información guardada de la visita anterior,
  // mientras se consulta al servidor (información pública y perfil, en paralelo).
  const guardada = local.pget('infoPublica', null);
  if (guardada) { E.info = guardada; if (!t) pantallaLogin(); }
  if (!guardada || t) $('#app').innerHTML = cargando('Preparando tu bitácora…');
  const pInfo = cargarInfo().then(() => { if (!E.info.sinConexion) { const g = Object.assign({}, E.info); local.pset('infoPublica', g); } });
  if (t) {
    E.token = t;
    try { const [perfil] = await Promise.all([api('perfil'), pInfo]); E.perfil = perfil; return postLogin(); } catch (e) { E.token = null; local.del('token'); }
  }
  await pInfo;
  if (!E.token && (!guardada || E.info.sinConexion || JSON.stringify(guardada.imagenes) !== JSON.stringify(E.info.imagenes))) pantallaLogin(E.info.sinConexion || '');
})();
</script>

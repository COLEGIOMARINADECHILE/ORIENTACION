<script>
/* =====================================================================
 * Mi Proyecto de Vida · Colegio Marina de Chile
 * Aplicación de una sola página servida por Google Apps Script.
 * Toda la información se pide al servidor con un token de sesión;
 * los permisos se validan SIEMPRE en el servidor (Code.gs → api()).
 * ===================================================================== */

const E = { token: null, perfil: null, info: {}, vista: 'inicio', params: {}, graficos: [], cursoSel: '' };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORES = ['#0b2a66', '#e3b505', '#c8553d', '#1f9e8f', '#6c4ab6', '#0f4c9c'];
const EMOJI = { brujula: '🧭', estrella: '⭐', lupa: '🔎', balanza: '⚖️', bandera: '🚩', camino: '🛤️', familia: '🏡', guia: '📘' };
const ROL_TXT = { admin: 'Administrador/a', docente: 'Docente', asistente: 'Asistente de la educación', estudiante: 'Estudiante', apoderado: 'Apoderado/a' };
const BLOQUE = { texto: ['📄', 'Contenido', 'libro'], caso: ['🧑‍🎓', 'Experiencia de vida', 'grupo'], psicologia: ['🧠', 'Lo que dice la psicología', 'ampolleta'], ejercicio: ['✏️', 'Ejercicio', 'lapiz'], recuerde: ['📌', 'Recuerda', 'chincheta'], enlace: ['🔗', 'Enlace', 'enlace'], video: ['🎬', 'Video', 'video'], imagen: ['🖼️', 'Imagen', 'imagen'] };
const DIM = [['claridad', 'Claridad del proyecto'], ['conocimiento', 'Conocimiento de opciones'], ['autonomia', 'Autonomía'], ['certeza', 'Certeza y plan']];
const RIASEC_T = { R: 'Realista', I: 'Investigador', A: 'Artístico', S: 'Social', E: 'Emprendedor', C: 'Convencional' };

/* ---------- Almacenamiento local (solo conveniencias, nunca datos personales) ---------- */
const local = {
  get(k, d) { try { const v = sessionStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
  pget(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  pset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Comunicación con el servidor ---------- */
function gs(fn, ...args) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e && e.message || 'Error de conexión')))[fn](...args);
  });
}
async function api(accion, datos) {
  const raw = await gs('api', { token: E.token, accion, datos: datos || {} });
  const r = JSON.parse(raw);
  if (!r.ok) {
    if (r.expirada) { salir(true); throw new Error('Tu sesión expiró. Ingresa nuevamente.'); }
    throw new Error(r.error);
  }
  return r.data;
}

/* ---------- Utilidades de interfaz ---------- */
function toast(msg, error) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (error ? ' error' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, error ? 5200 : 3000);
}
function modal(html, ancho) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-caja ${ancho ? 'ancho' : ''}" role="dialog" aria-modal="true"><button class="cerrar" aria-label="Cerrar" data-cerrar>✕</button>${html}</div>`;
  m.hidden = false;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-cerrar]')) cerrarModal(); };
  const f = $('input, textarea, select, button.btn', m); if (f) setTimeout(() => f.focus(), 30);
  return $('.modal-caja', m);
}
function cerrarModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) cerrarModal(); });
const cargando = (txt) => `<div class="cargando"><div class="spin"></div>${h(txt || 'Cargando…')}</div>`;
const vacio = (ico, txt) => `<div class="vacio"><span class="ico burbuja-ico">${ico}</span>${txt}</div>`;
function iniciales(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase(); }
function fecha(f) {
  if (!f) return '';
  const d = new Date(String(f).replace(' ', 'T'));
  if (isNaN(d)) return f;
  const hoy = new Date(); const mismo = d.toDateString() === hoy.toDateString();
  return mismo ? d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short', year: d.getFullYear() === hoy.getFullYear() ? undefined : 'numeric' });
}
function nivelCls(v) { return v === null || v === undefined ? '' : 'n' + (v >= 3.5 ? 4 : v >= 3 ? 3 : v >= 2 ? 2 : 1); }
function nivelTag(v) { return v === null || v === undefined ? '<span class="muted">—</span>' : `<span class="nivel ${nivelCls(v)}">${Number(v).toFixed(1)}</span>`; }
function formatoRut(v) {
  const l = String(v).replace(/[^0-9kK]/g, '').toUpperCase(); if (l.length < 2) return l;
  const c = l.slice(0, -1), d = l.slice(-1);
  return c.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + d;
}
function descargar(nombre, contenido, mime) {
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function csv(filas) {
  const esc = v => { const s = v === null || v === undefined ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + filas.map(f => f.map(esc).join(';')).join('\n');
}
function valorTxt(v) {
  if (v === undefined || v === null || v === '') return '—';
  if (Array.isArray(v)) return v.join(', ');
  if (typeof v === 'object') return Object.keys(v).map(k => k + ': ' + v[k]).join(' · ');
  return String(v);
}
function imprimir(nodo, titulo) {
  const clon = nodo.cloneNode(true);
  const orig = $$('canvas', nodo), copias = $$('canvas', clon);
  copias.forEach((c, i) => { const img = document.createElement('img'); img.src = orig[i].toDataURL('image/png'); img.style.maxWidth = '100%'; c.replaceWith(img); });
  $$('.no-print', clon).forEach(x => x.remove());
  const w = window.open('', '_blank');
  if (!w) { toast('Permite las ventanas emergentes para imprimir o guardar en PDF.', true); return; }
  const estilos = $$('style').map(s => s.outerHTML).join('');
  w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${h(titulo)}</title>${estilos}<style>body{background:#fff;padding:24px}.tarjeta{box-shadow:none}</style></head><body data-theme="light">
    <div class="fila" style="border-bottom:3px solid #e3b505;padding-bottom:10px;margin-bottom:16px">${logoHTML(42)}<div><b>${h(E.info.colegio)}</b><br><span class="muted peq">${h(E.info.unidad)} · Documento confidencial (Ley 21.719)</span></div></div>
    <h1>${h(titulo)}</h1><p class="muted peq">Generado el ${new Date().toLocaleString('es-CL')} por ${h(E.perfil.nombre)}</p>${clon.innerHTML}</body></html>`);
  w.document.close(); setTimeout(() => w.print(), 600);
}
function graficar(canvas, cfg) {
  if (!window.Chart || !canvas) return;
  Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
  Chart.defaults.color = getComputedStyle(document.body).getPropertyValue('--tinta-2').trim() || '#4a5470';
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: { duration: 500 } }, cfg.options || {});
  E.graficos.push(new Chart(canvas, cfg));
}
function limpiarGraficos() { E.graficos.forEach(g => { try { g.destroy(); } catch (e) {} }); E.graficos = []; }
function leerArchivo(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
function opcionesCursos(cursos, sel) {
  return cursos.map(c => `<option ${c.curso === sel ? 'selected' : ''} value="${h(c.curso)}">${h(c.curso)} (${c.estudiantes})</option>`).join('');
}
async function misCursos() { if (!E._cursos) E._cursos = await api('cursos'); return E._cursos; }

/* ---------- Logos e ilustraciones ---------- */
function logoHTML(alto) {
  if (E.info.imagenes && E.info.imagenes.logo) return `<img src="${h(E.info.imagenes.logo)}" alt="Insignia ${h(E.info.colegio)}" style="height:${alto || 70}px;width:auto">`;
  return `<svg viewBox="0 0 100 120" style="height:${alto || 70}px;width:auto" role="img" aria-label="Insignia del colegio"><path d="M6 6h88v62c0 26-20 40-44 48C26 108 6 94 6 68z" fill="#0b4aa0" stroke="#e3b505" stroke-width="5"/>
    <text x="50" y="26" fill="#e3b505" font-size="11" font-family="Georgia" text-anchor="middle" font-weight="700">COLEGIO</text>${timonSVG(50, 64, 22, '#dfe8f7')}
    <text x="50" y="104" fill="#e3b505" font-size="7" font-family="Georgia" text-anchor="middle">CONCEPCIÓN</text></svg>`;
}
function timonSVG(cx, cy, r, color) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${r / 6}"/><circle cx="${cx}" cy="${cy}" r="${r / 4}" fill="${color}"/>`;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, x2 = cx + Math.cos(a) * r * 1.45, y2 = cy + Math.sin(a) * r * 1.45;
    s += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${r / 8}" stroke-linecap="round"/>`;
  }
  return s;
}
function ilustracion() {
  if (E.info.imagenes && E.info.imagenes.portada) return `<img class="hero-ilus" src="${h(E.info.imagenes.portada)}" alt="Estudiantes del colegio con su proyecto de vida">`;
  return `<svg class="hero-ilus" viewBox="0 0 400 300" aria-hidden="true"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f4d35e"/><stop offset="1" stop-color="#e3b505"/></linearGradient></defs>
    <circle cx="200" cy="150" r="118" fill="rgba(255,255,255,.06)"/>${timonSVG(200, 150, 70, 'url(#g1)')}
    <path d="M60 250 q40-30 80 0 t80 0 t80 0 t80 0" stroke="#fff" stroke-opacity=".5" stroke-width="4" fill="none"/>
    <path d="M200 40 l10 26 -10 -6 -10 6z" fill="#c8553d"/></svg>`;
}
function confeti() {
  const col = ['#e3b505', '#c8553d', '#1f9e8f', '#6c4ab6', '#0f4c9c', '#f3a08a'];
  return `<div class="confeti" aria-hidden="true">${Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${col[i % col.length]};animation-delay:${(i % 9) * .12}s;transform:rotate(${i * 23}deg)"></i>`).join('')}</div>`;
}
const timonFondo =`<svg class="timon" viewBox="0 0 100 100" aria-hidden="true">${timonSVG(50, 50, 30, '#fff')}</svg>`;

/* =====================================================================
 * INGRESO
 * ===================================================================== */
const PERFILES = [
  ['estudiante', 'mochila', 'Estudiante', '#e3b505'], ['madre', 'mujer', 'Madre', '#c8553d'], ['padre', 'hombre', 'Padre', '#0f4c9c'],
  ['tutor', 'manos', 'Tutor/a', '#1f9e8f'], ['personal', 'colegio', 'Equipo', '#6c4ab6']
];
function pantallaLogin(msg) {
  limpiarGraficos();
  const tipo = local.pget('ultimoPerfil', 'estudiante');
  const foto = E.info.imagenes && E.info.imagenes.colegio ? `<div class="foto" style="background-image:url('${h(E.info.imagenes.colegio)}')"></div>` : '';
  $('#app').innerHTML = `
  <main class="login">
    <section class="login-hero">${foto}
      <div class="marca">${logoHTML(70)}<div><b>${h(E.info.colegio || 'Colegio Marina de Chile')}</b><span>${h(E.info.ciudad || 'Concepción')} · Orientación ${h(E.info.anio || '')}</span></div></div>
      <div>
        <h1 class="hero-titulo">Mi proyecto de <em>vida</em></h1>
        <p class="hero-sub">Tu bitácora para pensar quién eres, explorar tus opciones y decidir con autonomía tu próximo paso en la enseñanza media, junto a tu familia y al equipo del colegio.</p>
        <div class="hero-chips">${[['brujula', '5 sesiones'], ['chispa', 'Tu perfil de intereses'], ['medalla', 'Insignias'], ['chat', 'Chat con tu equipo']].map(x => `<span>${ic(x[0], 16)} ${x[1]}</span>`).join('')}</div>
      </div>
      ${ilustracion()}
      <svg class="olas" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60 Q150 10 300 60 T600 60 T900 60 T1200 60 V120 H0z" fill="#0f4c9c"/><path d="M0 80 Q150 40 300 80 T600 80 T900 80 T1200 80 V120 H0z" fill="#071b44"/></svg>
    </section>
    <section class="login-form">
      <form class="tarjeta-login" id="fLogin" autocomplete="on" novalidate>
        <h2>Bienvenida, bienvenido</h2>
        <p class="muted">Elige tu perfil e ingresa con el RUT del estudiante.</p>
        <div class="perfiles" role="group" aria-label="Perfil de ingreso">
          ${PERFILES.map(p => `<button type="button" class="perfil-op" data-tipo="${p[0]}" aria-pressed="${p[0] === tipo}" style="--c:${p[3]}"><span class="ico">${ic(p[1], 22)}</span>${p[2]}</button>`).join('')}
        </div>
        <label class="campo"><span id="lblRut">RUT del estudiante</span><input class="input" id="rut" inputmode="text" autocomplete="username" placeholder="12.345.678-9" required></label>
        <label class="campo"><span>Clave</span><input class="input" id="clave" type="password" autocomplete="current-password" required>
          <small id="ayudaClave">La primera vez, tu clave es la fecha de nacimiento del estudiante: DDMMAAAA (ej. 05032012).</small></label>
        <button class="btn oro bloque" id="bIngresar">Ingresar</button>
        <p class="err" id="errLogin">${h(msg || '')}</p>
        <p class="aviso-priv">🔒 Tus datos personales se tratan de forma confidencial según la Ley 21.719. <a href="#" id="lnkPriv">Ver aviso de privacidad</a>.</p>
      </form>
    </section>
  </main>`;
  let sel = tipo;
  const ajustar = () => {
    $('#lblRut').textContent = sel === 'personal' ? 'Tu RUT' : 'RUT del estudiante';
    $('#ayudaClave').textContent = sel === 'personal' ? 'Usa la clave que te entregó el administrador.' :
      'La primera vez, la clave es la fecha de nacimiento del estudiante: DDMMAAAA (ej. 05032012). Cada perfil tiene su propia clave.';
  };
  ajustar();
  $$('.perfil-op').forEach(b => b.onclick = () => { sel = b.dataset.tipo; $$('.perfil-op').forEach(x => x.setAttribute('aria-pressed', x === b)); ajustar(); });
  $('#rut').addEventListener('blur', e => { e.target.value = formatoRut(e.target.value); });
  $('#lnkPriv').onclick = e => { e.preventDefault(); verPrivacidad(false); };
  $('#fLogin').onsubmit = async e => {
    e.preventDefault();
    const b = $('#bIngresar'); b.disabled = true; b.textContent = 'Verificando…'; $('#errLogin').textContent = '';
    try {
      const r = await gs('login', $('#rut').value, $('#clave').value, sel);
      if (!r.ok) throw new Error(r.error);
      local.pset('ultimoPerfil', sel);
      E.token = r.token; E.perfil = r.perfil; local.set('token', r.token);
      await postLogin();
    } catch (err) { $('#errLogin').textContent = err.message; b.disabled = false; b.textContent = 'Ingresar'; }
  };
}

async function postLogin() {
  if (!E.perfil.consentimiento) { verPrivacidad(true); return; }
  if (E.perfil.debeCambiar && ['admin', 'docente', 'asistente'].includes(E.perfil.rol)) { renderShell(); ir('cuenta'); cambiarClaveModal(true); return; }
  renderShell(); ir(local.get('vista', 'inicio'));
}

function textoPrivacidad() {
  return `<h2>Aviso de privacidad</h2>
  <p><b>Responsable:</b> ${h(E.info.colegio || 'Colegio Marina de Chile')}, ${h(E.info.ciudad || 'Concepción')}. Contacto: <a href="mailto:${h(E.info.contactoPrivacidad)}">${h(E.info.contactoPrivacidad)}</a>.</p>
  <p><b>Finalidad:</b> acompañar el proceso de orientación y proyecto de vida de los estudiantes: sesiones, cuestionarios, retroalimentación, comunicación con las familias y análisis pedagógico. Los datos no se usan para otros fines, no se venden ni se publican.</p>
  <p><b>Datos tratados:</b> identificación (RUT, nombre, curso, fecha de nacimiento), respuestas a cuestionarios, mensajes y retroalimentación. Por tratarse de niños, niñas y adolescentes, prima su interés superior.</p>
  <p><b>Quién accede:</b> solo el equipo del colegio asignado al curso (profesores, asistentes, orientación y UTP). Las familias ven el material para familias, sus propias respuestas y, si el colegio lo autoriza, la retroalimentación de su hijo o hija.</p>
  <p><b>Análisis con IA:</b> cuando se usa, se envían datos seudonimizados (sin nombre ni RUT) a un proveedor que actúa como encargado del tratamiento. Los análisis orientan; no clasifican ni reemplazan el criterio profesional.</p>
  <p><b>Conservación:</b> los registros se conservan por ${h(E.info.retencionMeses || 24)} meses o hasta el término del proceso, salvo obligación legal.</p>
  <p><b>Sus derechos:</b> acceso, rectificación, supresión, oposición, portabilidad y bloqueo. Puede descargar sus datos en "Mi cuenta" o escribir al contacto indicado.</p>
  <p><b>Seguridad:</b> claves cifradas, sesiones con expiración, acceso por rol y registro de auditoría.</p>`;
}
function verPrivacidad(aceptar) {
  const c = modal(textoPrivacidad() + (aceptar ? `<div class="fila mt"><button class="btn oro" id="bAcepto">He leído y acepto</button><button class="btn fantasma" id="bNo">Salir</button></div>` : ''));
  if (aceptar) {
    $('#modal').onclick = null; $('.cerrar', c).remove();
    $('#bAcepto').onclick = async () => { try { await api('aceptarPrivacidad'); E.perfil.consentimiento = true; cerrarModal(); postLogin(); } catch (e) { toast(e.message, true); } };
    $('#bNo').onclick = () => { cerrarModal(); salir(); };
  }
}

async function salir(expirada) {
  if (E.token && !expirada) { try { await gs('logout', E.token); } catch (e) {} }
  E.token = null; E.perfil = null; E._cursos = null; local.del('token'); local.del('vista');
  cerrarModal(); pantallaLogin(expirada ? 'Tu sesión expiró. Ingresa nuevamente.' : '');
}

/* =====================================================================
 * ESTRUCTURA Y NAVEGACIÓN
 * ===================================================================== */
function menu() {
  const r = E.perfil.rol;
  if (r === 'estudiante') return [['inicio', 'inicio', 'Inicio'], ['sesiones', 'brujula', 'Sesiones'], ['cuestionarios', 'tarea', 'Cuestionarios'], ['resultados', 'grafico', 'Mis resultados'], ['mensajes', 'chat', 'Mensajes'], ['cuenta', 'usuario', 'Mi cuenta']];
  if (r === 'apoderado') return [['inicio', 'inicio', 'Inicio'], ['sesiones', 'libro', 'Manual familias'], ['cuestionarios', 'tarea', 'Encuestas'], ['resultados', 'grafico', 'Resultados'], ['mensajes', 'chat', 'Mensajes'], ['cuenta', 'usuario', 'Mi cuenta']];
  const m = [['inicio', 'inicio', 'Panel'], ['cursos', 'grupo', 'Mis cursos'], ['sesiones', 'brujula', 'Sesiones'], ['materiales', 'clip', 'Materiales'], ['cuestionarios', 'tarea', 'Cuestionarios'],
    ['reportes', 'tendencia', 'Reportes'], ['analisis', 'chispa', 'Análisis IA'], ['mensajes', 'chat', 'Mensajes']];
  if (r === 'admin') m.push(['sep', '', 'Administración'], ['usuarios', 'credencial', 'Usuarios'], ['carga', 'subir', 'Carga masiva'], ['config', 'ajustes', 'Configuración'], ['auditoria', 'escudo', 'Auditoría']);
  m.push(['cuenta', 'usuario', 'Mi cuenta']);
  return m;
}
function renderShell() {
  const p = E.perfil;
  const items = menu();
  $('#app').innerHTML = `
  <div class="shell">
    <aside class="lateral">
      <div class="marca">${logoHTML(48)}<div><b>Mi Proyecto de Vida</b><span>${h(E.info.colegio)}</span></div></div>
      <nav class="nav" aria-label="Menú principal">
        ${items.map(i => i[0] === 'sep' ? `<div class="nav-sep">${i[2]}</div>` : `<button data-v="${i[0]}"><span class="ico">${ic(i[1], 19)}</span>${i[2]}${i[0] === 'mensajes' ? '<span class="badge oculto" data-badge></span>' : ''}</button>`).join('')}
      </nav>
      <div class="pie"><div class="pie-tarjeta"><div class="avatar">${h(iniciales(p.nombre))}</div><div><b>${h(p.nombre.split(' ').slice(0, 2).join(' '))}</b><span>${h(ROL_TXT[p.rol])}${p.estudianteNombre && p.rol === 'apoderado' ? ' de ' + h(p.estudianteNombre.split(' ')[0]) : ''}${p.cursos.length ? ' · ' + h(p.cursos.join(', ')) : ''}</span></div></div></div>
      <svg class="lateral-timon" viewBox="0 0 100 100" aria-hidden="true">${timonSVG(50, 50, 30, '#fff')}</svg>
    </aside>
    <div class="principal">
      <header class="barra"><h2 id="tituloVista"></h2>
        <button class="btn fantasma mini" id="bTema" title="Cambiar tema" aria-label="Cambiar tema">${ic('luna', 18)}</button>
        <div class="avatar" title="${h(p.nombre)}">${h(iniciales(p.nombre))}</div>
        <button class="btn sec mini" id="bSalir">${ic('salir', 16)} Salir</button></header>
      <main class="contenido" id="contenido"></main>
    </div>
  </div>
  <nav class="nav-movil" aria-label="Menú">

function renderBloque(b) {
  const [, etq, icono] = BLOQUE[b.tipo] || BLOQUE.texto;

  if (b.tipo === 'enlace') return `<div class="bloque enlace fila entre">${cab}<a class="btn mini oro" href="${h(b.texto || b.url)}" target="_blank" rel="noopener">Abrir sitio ${ic('flecha', 15)}</a></div>`;
  if (b.tipo === 'video') {
    const m = String(b.texto || b.url).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
    return `<div class="bloque video">${cab}${m ? `<div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="${h(b.titulo)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>` : `<a href="${h(b.texto)}" target="_blank" rel="noopener">Ver video ↗</a>`}</div>`;
  }
  if (b.tipo === 'imagen') return `<div class="bloque imagen">${cab}<img src="${h(b.texto || b.url)}" alt="${h(b.titulo)}" style="border-radius:12px"></div>`;
  return `<div class="bloque ${h(b.tipo)}">${cab}<div class="bloque-txt">${sanear(b.texto)}</div></div>`;
}
/** Permite solo etiquetas de formato básicas en los textos de sesiones. */
function sanear(html) {
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const permit = ['B', 'I', 'EM', 'STRONG', 'BR', 'P', 'UL', 'OL', 'LI', 'U', 'SMALL', 'A'];
  const limpiar = n => Array.from(n.childNodes).forEach(x => {
    if (x.nodeType === 1) {
      if (!permit.includes(x.tagName)) { x.replaceWith(document.createTextNode(x.textContent)); return; }
      Array.from(x.attributes).forEach(a => { if (!(x.tagName === 'A' && a.name === 'href' && /^https:/i.test(a.value))) x.removeAttribute(a.name); });
      if (x.tagName === 'A') { x.setAttribute('target', '_blank'); x.setAttribute('rel', 'noopener'); }
      limpiar(x);
    }
  });
  limpiar(t.content); return t.innerHTML;
}

      ${pers ? `<button class="btn mini sec" onclick="ir('cuestionarios')">Gestionar</button>` : q.respondido ? `<button class="btn mini sec" data-q="${q.id}">Ver / editar</button>` : `<button class="btn mini oro" data-q="${q.id}">Responder</button>`}</div>`).join('')}</div>` : ''}
    <h3 class="mt2">Material de la sesión</h3><div id="matSes">${listaMateriales(s.materiales)}</div>`;
  $$('[data-pop]', c).forEach(b => b.onclick = () => mostrarEmergente(s.emergentes[b.dataset.pop]));
  $$('[data-q]', c).forEach(b => b.onclick = () => ir('responder', { id: b.dataset.q }));
  activarMateriales(c);
  const alAbrir = s.emergentes.find(e => e.disparador === 'abrir');
  if (alAbrir && !pers) setTimeout(() => mostrarEmergente(alAbrir), 350);
  if (pers) {
    $('#bEditar').onclick = () => editorSesion(s);
    $('#bRepSes').onclick = async () => { const cursos = await misCursos(); E.cursoSel = E.cursoSel || (cursos[0] && cursos[0].curso); ir('reportes', { tab: 'sesion', sesionId: s.id }); };
    $('#bMat').onclick = () => formMaterial(s.baseId || s.id);
  }
};

function editorSesion(s) {
  const admin = E.perfil.rol === 'admin';
  s = s || { titulo: '', objetivo: '', audiencia: 'estudiantes', cursos: admin ? '' : E.perfil.cursos.join(', '), estado: 'borrador', numero: 0, imagen: 'brujula', bloques: [], emergentes: [] };
  let bloques = JSON.parse(JSON.stringify(s.bloques)), pops = JSON.parse(JSON.stringify(s.emergentes));
  const c = modal(`<h2>${s.id ? 'Editar sesión' : 'Nueva sesión'}</h2>
    ${s.id && !admin && !s.baseId ? '<p class="chip ok">Los cambios se guardarán como versión para sus cursos; los demás cursos no se ven afectados.</p>' : ''}
    <div class="grid g2 mt"><label class="campo"><span>Título</span><input class="input" id="sTit" value="${h(s.titulo)}"></label>
    <label class="campo"><span>Ícono</span><select class="input" id="sImg">${Object.keys(EMOJI).map(k => `<option value="${k}" ${s.imagen === k ? 'selected' : ''}>${EMOJI[k]} ${k}</option>`).join('')}</select></label></div>
    <label class="campo"><span>Objetivo</span><textarea class="input" id="sObj" style="min-height:60px">${h(s.objetivo)}</textarea></label>
    ${admin || !s.id ? `<div class="grid g4">
      <label class="campo"><span>N.°</span><input class="input" id="sNum" type="number" min="0" value="${s.numero || 0}"></label>
      <label class="campo"><span>Audiencia</span><select class="input" id="sAud" ${!admin ? 'disabled' : ''}>${['estudiantes', 'familias', 'docentes', 'todos'].map(a => `<option ${s.audiencia === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
      <label class="campo"><span>Estado</span><select class="input" id="sEst">${['borrador', 'publicada'].map(a => `<option ${s.estado === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
      <label class="campo"><span>Cursos</span><input class="input" id="sCur" value="${h(s.cursos)}" placeholder="vacío = todos"></label></div>` : ''}
    <h3 class="mt">Contenido</h3><div id="eBloques"></div>
    <button class="btn mini sec" id="bAddBloque">＋ Agregar bloque</button>
    <h3 class="mt2">Elementos emergentes 💡</h3><p class="muted peq">Ventanas con consejos, preguntas o recordatorios. "Al abrir" aparece apenas el estudiante entra; "Botón" aparece como botón dorado.</p>
    <div id="ePops"></div><button class="btn mini sec" id="bAddPop">＋ Agregar emergente</button>
    <div class="fila mt2"><button class="btn oro" id="bGuardarSes">Guardar</button>${s.id && admin ? '<button class="btn peligro" id="bEliminarSes">Eliminar</button>' : ''}<button class="btn fantasma" data-cerrar>Cancelar</button></div>`, true);
  const pintar = () => {
    $('#eBloques', c).innerHTML = bloques.map((b, i) => `<div class="editor-bloque"><div class="fila"><select class="input" style="width:auto" data-bt="${i}">${Object.keys(BLOQUE).map(k => `<option value="${k}" ${b.tipo === k ? 'selected' : ''}>${BLOQUE[k][0]} ${BLOQUE[k][1]}</option>`).join('')}</select>
      <input class="input" style="flex:1" data-bti="${i}" placeholder="Título" value="${h(b.titulo)}"><button class="btn mini fantasma" data-up="${i}" title="Subir">↑</button><button class="btn mini fantasma" data-del="${i}" title="Quitar">✕</button></div>
      <textarea class="input mt" data-btx="${i}" placeholder="${['enlace', 'video', 'imagen'].includes(b.tipo) ? 'URL https://…' : 'Texto (admite <b>, <i>, <br>)'}">${h(b.texto)}</textarea></div>`).join('') || '<p class="muted">Sin bloques.</p>';
    $('#ePops', c).innerHTML = pops.map((p, i) => `<div class="editor-bloque"><div class="fila"><input class="input" style="width:64px" data-pi="${i}" value="${h(p.icono)}" aria-label="Ícono"><input class="input" style="flex:1" data-pt="${i}" placeholder="Título" value="${h(p.titulo)}">
      <select class="input" style="width:auto" data-pd="${i}"><option value="boton" ${p.disparador === 'boton' ? 'selected' : ''}>Botón</option><option value="abrir" ${p.disparador === 'abrir' ? 'selected' : ''}>Al abrir</option></select><button class="btn mini fantasma" data-pdel="${i}">✕</button></div>
      <textarea class="input mt" style="min-height:60px" data-px="${i}" placeholder="Mensaje">${h(p.texto)}</textarea></div>`).join('');
    $$('[data-bt]', c).forEach(x => x.onchange = () => { bloques[x.dataset.bt].tipo = x.value; pintar(); });
    $$('[data-bti]', c).forEach(x => x.oninput = () => bloques[x.dataset.bti].titulo = x.value);
    $$('[data-btx]', c).forEach(x => x.oninput = () => bloques[x.dataset.btx].texto = x.value);
    $$('[data-del]', c).forEach(x => x.onclick = () => { bloques.splice(+x.dataset.del, 1); pintar(); });
    $$('[data-up]', c).forEach(x => x.onclick = () => { const i = +x.dataset.up; if (i > 0) { [bloques[i - 1], bloques[i]] = [bloques[i], bloques[i - 1]]; pintar(); } });
    $$('[data-pi]', c).forEach(x => x.oninput = () => pops[x.dataset.pi].icono = x.value);
    $$('[data-pt]', c).forEach(x => x.oninput = () => pops[x.dataset.pt].titulo = x.value);
    $$('[data-px]', c).forEach(x => x.oninput = () => pops[x.dataset.px].texto = x.value);
    $$('[data-pd]', c).forEach(x => x.onchange = () => pops[x.dataset.pd].disparador = x.value);
    $$('[data-pdel]', c).forEach(x => x.onclick = () => { pops.splice(+x.dataset.pdel, 1); pintar(); });
  };
  pintar();
  $('#bAddBloque', c).onclick = () => { bloques.push({ tipo: 'texto', titulo: '', texto: '' }); pintar(); };
  $('#bAddPop', c).onclick = () => { pops.push({ icono: '💡', titulo: '', texto: '', disparador: 'boton' }); pintar(); };
  $('#bGuardarSes', c).onclick = async (ev) => {
    const d = { id: s.id, titulo: $('#sTit', c).value, objetivo: $('#sObj', c).value, imagen: $('#sImg', c).value, bloques, emergentes: pops };
    if ($('#sNum', c)) Object.assign(d, { numero: +$('#sNum', c).value, audiencia: $('#sAud', c).value, estado: $('#sEst', c).value, cursos: $('#sCur', c).value });
    ev.target.disabled = true;
    try { const r = await api('guardarSesion', d); cerrarModal(); toast('Sesión guardada'); ir('sesion', { id: r.id }); } catch (e) { toast(e.message, true); ev.target.disabled = false; }
  };
  if ($('#bEliminarSes', c)) $('#bEliminarSes', c).onclick = async () => {
    if (!confirm('¿Eliminar definitivamente esta sesión?')) return;
    try { await api('eliminarSesion', { id: s.id }); cerrarModal(); toast('Sesión eliminada'); ir('sesiones'); } catch (e) { toast(e.message, true); }
  };
}

VISTAS.materiales = async (c) => {
  const [mats, ses] = await Promise.all([api('materiales'), api('sesiones')]);
  E._sesiones = ses;
  c.innerHTML = `<div class="fila entre"><p class="muted" style="margin:0">Comparta guías, presentaciones, videos o enlaces con sus cursos.</p><button class="btn oro" id="bNuevoMat">＋ Agregar material</button></div><div class="mt">${listaMateriales(mats)}</div>`;
  $('#bNuevoMat').onclick = () => formMaterial('');
  activarMateriales(c);
};
async function formMaterial(sesionId) {
  const ses = E._sesiones || await api('sesiones');
  const cursos = await misCursos();
  const c = modal(`<h2>Agregar material</h2>
    <label class="campo"><span>Título</span><input class="input" id="mTit"></label>
    <label class="campo"><span>Descripción</span><textarea class="input" id="mDesc" style="min-height:60px"></textarea></label>
    <div class="grid g2"><label class="campo"><span>Sesión</span><select class="input" id="mSes"><option value="">General (sin sesión)</option>${ses.map(s => `<option value="${s.baseId || s.id}" ${(s.baseId || s.id) === sesionId ? 'selected' : ''}>${s.numero ? 'S' + s.numero + ' · ' : ''}${h(s.titulo)} (${h(s.audiencia)})</option>`).join('')}</select></label>
    <label class="campo"><span>Para</span><select class="input" id="mAud"><option value="estudiantes">Estudiantes</option><option value="familias">Familias</option><option value="docentes">Equipo docente</option><option value="todos">Todos</option></select></label></div>
    <label class="campo"><span>Cursos</span><select class="input" id="mCur" multiple size="${Math.min(5, cursos.length + 1)}">${E.perfil.rol === 'admin' ? '<option value="" selected>Todos los cursos</option>' : ''}${cursos.map(x => `<option ${E.perfil.rol !== 'admin' ? 'selected' : ''}>${h(x.curso)}</option>`).join('')}</select><small>Ctrl/Cmd + clic para elegir varios.</small></label>
    <div class="tabs"><button class="tab activo" data-mt="archivo">📄 Subir archivo</button><button class="tab" data-mt="enlace">🔗 Enlace</button></div>
    <div id="mArchivo"><div class="drop" id="mDrop">Arrastre un archivo aquí o <label style="color:var(--mar);cursor:pointer;font-weight:700">elíjalo<input type="file" id="mFile" hidden></label><div class="muted peq">PDF, imágenes, documentos · máx. 15 MB · se guarda de forma privada</div><div id="mNombre" class="mt"></div></div></div>
    <div id="mEnlace" hidden><label class="campo"><span>URL (https)</span><input class="input" id="mUrl" placeholder="https://"></label></div>
    <div class="fila mt"><button class="btn oro" id="bSubirMat">Guardar</button><button class="btn fantasma" data-cerrar>Cancelar</button></div>`);
  let modo = 'archivo', archivo = null;
  $$('[data-mt]', c).forEach(b => b.onclick = () => { modo = b.dataset.mt; $$('[data-mt]', c).forEach(x => x.classList.toggle('activo', x === b)); $('#mArchivo', c).hidden = modo !== 'archivo'; $('#mEnlace', c).hidden = modo !== 'enlace'; });
  const elegir = f => { archivo = f; $('#mNombre', c).innerHTML = f ? `<span class="chip">${h(f.name)} · ${(f.size / 1048576).toFixed(1)} MB</span>` : ''; if (f && !$('#mTit', c).value) $('#mTit', c).value = f.name.replace(/\.[^.]+$/, ''); };
  $('#mFile', c).onchange = e => elegir(e.target.files[0]);
  const drop = $('#mDrop', c);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('sobre'); };
  drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('sobre'); elegir(e.dataTransfer.files[0]); };
  $('#bSubirMat', c).onclick = async ev => {
    const cur = Array.from($('#mCur', c).selectedOptions).map(o => o.value).filter(Boolean).join(', ');
    const d = { titulo: $('#mTit', c).value, descripcion: $('#mDesc', c).value, sesionId: $('#mSes', c).value, audiencia: $('#mAud', c).value, cursos: cur };
    if (modo === 'archivo') {
      if (!archivo) return toast('Elija un archivo.', true);
      if (archivo.size > 15 * 1048576) return toast('El archivo supera 15 MB. Súbalo a Drive y comparta el enlace.', true);
      d.base64 = await leerArchivo(archivo); d.mime = archivo.type || 'application/octet-stream'; d.nombre = archivo.name;
    } else d.url = $('#mUrl', c).value;
    ev.target.disabled = true; ev.target.textContent = 'Subiendo…';
    try { await api('guardarMaterial', d); cerrarModal(); toast('Material compartido'); ir(E.vista, E.params); } catch (e) { toast(e.message, true); ev.target.disabled = false; ev.target.textContent = 'Guardar'; }
  };
}

VISTAS.cuestionarios = async (c) => {
  const lista = await api('cuestionarios');
  if (!esPersonal()) {
    c.innerHTML = `<p class="muted">Responde con calma y con tus propias palabras. Puedes volver a editar tus respuestas mientras el cuestionario esté habilitado.</p>
      <div class="grid g2">${lista.map(q => { const ins = INSIGNIAS[q.codigo] || ['', 'tarea', '#0f4c9c']; return `<div class="tarjeta cuest-card ${q.respondido ? 'hecho' : ''}" style="--c:${ins[2]}"><div class="cuest-ico">${ic(q.respondido ? 'check' : ins[1], 26)}</div>
        <div style="flex:1;min-width:0"><span class="chip ${q.respondido ? 'ok' : 'oro'}">${q.respondido ? 'Respondido' : 'Pendiente'}</span><h3 class="mt" style="margin-bottom:2px">${h(q.titulo)}</h3><div class="muted peq">${h(q.descripcion)}</div>
        ${ins[0] ? `<div class="peq mt" style="color:var(--c);font-weight:700">${ic('medalla', 14)} Insignia: ${h(ins[0])}</div>` : ''}</div>
        <button class="btn ${q.respondido ? 'sec' : 'oro'}" data-q="${q.id}">${q.respondido ? 'Revisar' : 'Responder'}</button></div>`; }).join('') || vacio(ic('tarea', 28), 'No hay cuestionarios habilitados por ahora.')}</div>`;
    $$('[data-q]', c).forEach(b => b.onclick = () => ir('responder', { id: b.dataset.q }));
    return;
  }
  const cursos = await misCursos();
  const admin = E.perfil.rol === 'admin';
  E.cursoSel = E.cursoSel || (cursos[0] && cursos[0].curso) || '';
  const hab = q => q.habilitado && (!q.cursos || q.cursos.split(/[,;]/).map(x => x.trim().toUpperCase().replace(/[\s°º.\-]/g, '')).includes(E.cursoSel.toUpperCase().replace(/[\s°º.\-]/g, '')));
  c.innerHTML = `<div class="fila entre"><label class="fila"><b>Curso</b><select class="input" style="width:auto" id="qCurso">${opcionesCursos(cursos, E.cursoSel)}</select></label>
    ${admin ? '<button class="btn oro" id="bNuevoQ">＋ Nuevo cuestionario</button>' : ''}</div>
    <p class="muted peq mt">Active un cuestionario para que el curso lo vea y pueda responderlo.${admin ? ' Como administrador también puede habilitarlo para todos los cursos a la vez.' : ''}</p>
    <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Código</th><th>Cuestionario</th><th>Para</th><th>Preguntas</th><th>Estado en ${h(E.cursoSel)}</th><th></th></tr></thead><tbody>
    ${lista.map(q => `<tr><td><span class="chip">${h(q.codigo)}</span></td><td><b>${h(q.titulo)}</b><div class="muted peq">${h(q.descripcion)}</div></td><td>${h(q.audiencia)}</td><td>${q.nPreguntas}</td>
      <td><label class="fila"><input type="checkbox" data-hab="${q.id}" ${hab(q) ? 'checked' : ''} ${!E.cursoSel ? 'disabled' : ''}> ${hab(q) ? '<span class="chip ok">Habilitado</span>' : '<span class="chip">Inactivo</span>'}</label>
      ${admin ? `<div class="muted peq">Global: ${q.habilitado ? (q.cursos ? h(q.cursos) : 'todos los cursos') : 'desactivado'}</div>` : ''}</td>
      <td class="fila"><button class="btn mini sec" data-ver="${q.id}">Vista previa</button>${admin ? `<button class="btn mini sec" data-edit="${q.id}">Editar</button><button class="btn mini sec" data-todos="${q.id}" data-on="${q.habilitado && !q.cursos ? 0 : 1}">${q.habilitado && !q.cursos ? 'Desactivar en todos' : 'Habilitar en todos'}</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#qCurso').onchange = e => { E.cursoSel = e.target.value; ir('cuestionarios'); };
  $$('[data-hab]', c).forEach(x => x.onchange = async () => {
    try { await api('habilitarCuestionario', { id: x.dataset.hab, curso: E.cursoSel, habilitado: x.checked }); toast(x.checked ? 'Habilitado para ' + E.cursoSel : 'Desactivado para ' + E.cursoSel); ir('cuestionarios'); } catch (e) { toast(e.message, true); x.checked = !x.checked; }
  });
  $$('[data-todos]', c).forEach(b => b.onclick = async () => { try { await api('habilitarCuestionario', { id: b.dataset.todos, habilitado: b.dataset.on === '1', cursos: '' }); ir('cuestionarios'); } catch (e) { toast(e.message, true); } });
  $$('[data-ver]', c).forEach(b => b.onclick = () => ir('responder', { id: b.dataset.ver, previa: true }));
  $$('[data-edit]', c).forEach(b => b.onclick = async () => editorCuestionario(await api('cuestionario', { id: b.dataset.edit })));
  if ($('#bNuevoQ')) $('#bNuevoQ').onclick = () => editorCuestionario(null);
};

function editorCuestionario(q) {
  q = q || { codigo: '', titulo: '', descripcion: '', audiencia: 'estudiantes', sesionId: '', preguntas: [] };
  let preg = JSON.parse(JSON.stringify(q.preguntas));
  const c = modal(`<h2>${q.id ? 'Editar' : 'Nuevo'} cuestionario</h2>
    <div class="grid g3"><label class="campo"><span>Código</span><input class="input" id="qCod" value="${h(q.codigo)}" placeholder="E4"></label>
    <label class="campo"><span>Para</span><select class="input" id="qAud"><option ${q.audiencia === 'estudiantes' ? 'selected' : ''}>estudiantes</option><option ${q.audiencia === 'familias' ? 'selected' : ''}>familias</option></select></label>
    <label class="campo"><span>Sesión</span><select class="input" id="qSes"><option value="">—</option></select></label></div>
    <label class="campo"><span>Título</span><input class="input" id="qTit" value="${h(q.titulo)}"></label>
    <label class="campo"><span>Instrucciones</span><input class="input" id="qDesc" value="${h(q.descripcion)}"></label>
    <p class="muted peq">Los códigos E1, E2, E3, RIASEC, TRAMPAS, AUTONOMIA, F1 y F2 alimentan los indicadores de proyección: cambie sus preguntas con cuidado.</p>
    <div id="qPreg"></div><button class="btn mini sec" id="bAddP">＋ Pregunta</button>
    <div class="fila mt2"><button class="btn oro" id="bGuardarQ">Guardar</button><button class="btn fantasma" data-cerrar>Cancelar</button></div>`, true);
  api('sesiones').then(ss => { $('#qSes', c).innerHTML = '<option value="">—</option>' + ss.filter(s => !s.baseId).map(s => `<option value="${s.id}" ${q.sesionId === s.id ? 'selected' : ''}>${s.numero ? 'S' + s.numero + ' · ' : ''}${h(s.titulo)}</option>`).join(''); });
  const tipos = { likert: 'Escala de acuerdo', unica: 'Selección única', multiple: 'Selección múltiple', abierta: 'Respuesta abierta', escala: 'Tabla de ítems (1-4)', pareo: 'Pareo / asociación', pasos: 'Plan en pasos' };
  const pintar = () => {
    $('#qPreg', c).innerHTML = preg.map((p, i) => `<div class="editor-bloque"><div class="fila"><b>${i + 1}.</b><select class="input" style="width:auto" data-t="${i}">${Object.keys(tipos).map(k => `<option value="${k}" ${p.tipo === k ? 'selected' : ''}>${tipos[k]}</option>`).join('')}</select>
      <label class="fila peq"><input type="checkbox" data-o="${i}" ${p.obligatoria ? 'checked' : ''}> Obligatoria</label><span style="flex:1"></span><button class="btn mini fantasma" data-x="${i}">✕</button></div>
      <input class="input mt" data-tx="${i}" value="${h(p.texto)}" placeholder="Enunciado">
      ${['likert', 'unica', 'multiple', 'escala', 'pareo'].includes(p.tipo) ? `<textarea class="input mt" data-op="${i}" style="min-height:60px" placeholder="Opciones, una por línea">${h((p.opciones || []).join('\n'))}</textarea>` : ''}
      ${['escala', 'pareo'].includes(p.tipo) ? `<textarea class="input mt" data-it="${i}" style="min-height:60px" placeholder="Ítems, uno por línea">${h((p.items || []).map(x => x.texto).join('\n'))}</textarea>` : ''}</div>`).join('');
    $$('[data-t]', c).forEach(x => x.onchange = () => { preg[x.dataset.t].tipo = x.value; if (x.value === 'likert' && !preg[x.dataset.t].opciones) preg[x.dataset.t].opciones = ['Totalmente en desacuerdo', 'En desacuerdo', 'De acuerdo', 'Totalmente de acuerdo']; pintar(); });
    $$('[data-o]', c).forEach(x => x.onchange = () => preg[x.dataset.o].obligatoria = x.checked);
    $$('[data-tx]', c).forEach(x => x.oninput = () => preg[x.dataset.tx].texto = x.value);
    $$('[data-op]', c).forEach(x => x.oninput = () => preg[x.dataset.op].opciones = x.value.split('\n').map(s => s.trim()).filter(Boolean));
    $$('[data-it]', c).forEach(x => x.oninput = () => { const p = preg[x.dataset.it]; const prev = p.items || []; p.items = x.value.split('\n').map(s => s.trim()).filter(Boolean).map((t, j) => Object.assign({}, prev[j] || {}, { id: (prev[j] && prev[j].id) || (p.tipo === 'pareo' ? 't' : 'a') + (j + 1), texto: t })); });
    $$('[data-x]', c).forEach(x => x.onclick = () => { preg.splice(+x.dataset.x, 1); pintar(); });
  };
  pintar();
  $('#bAddP', c).onclick = () => { const n = preg.length + 1; let id = 'q' + n; while (preg.some(p => p.id === id)) id += 'b'; preg.push({ id, n, tipo: 'abierta', texto: '' }); pintar(); };

function renderPregunta(p, v) {
  const nombre = 'p_' + p.id;
  let cuerpo = '';
  if (p.tipo === 'likert' || p.tipo === 'unica') cuerpo = `<div class="opciones" role="radiogroup">${p.opciones.map(o => `<label class="opcion"><input type="radio" name="${nombre}" value="${h(o)}" ${v === o ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
  else if (p.tipo === 'multiple') cuerpo = `<div class="opciones">${p.opciones.map(o => `<label class="opcion"><input type="checkbox" name="${nombre}" value="${h(o)}" ${(v || []).includes(o) ? 'checked' : ''}><span>${h(o)}</span></label>`).join('')}</div>`;
  else if (p.tipo === 'abierta') cuerpo = `<textarea class="input" name="${nombre}" maxlength="3000" placeholder="Escribe aquí…">${h(v || '')}</textarea>`;
  else if (p.tipo === 'escala') cuerpo = `<div class="tabla-wrap"><table class="escala"><thead><tr><th style="text-align:left">Actividad</th>${p.opciones.map(o => `<th>${h(o)}</th>`).join('')}</tr></thead><tbody>
    ${p.items.map((it, i) => `<tr><td>${i + 1}. ${h(it.texto)}</td>${p.opciones.map((o, j) => `<td class="o"><input type="radio" aria-label="${h(o)}" name="${nombre}_${it.id}" value="${j + 1}" ${v && String(v[it.id]) === String(j + 1) ? 'checked' : ''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  else if (p.tipo === 'pareo') cuerpo = p.items.map((it, i) => `<div class="fila" style="margin-bottom:10px;align-items:flex-start"><span style="flex:1;min-width:220px">${i + 1}. ${h(it.texto)}</span><select class="input" style="width:auto;min-width:220px" name="${nombre}_${it.id}"><option value="">Elige la trampa…</option>${p.opciones.map(o => `<option ${v && v[it.id] === o ? 'selected' : ''}>${h(o)}</option>`).join('')}</select></div>`).join('');
  else if (p.tipo === 'pasos') cuerpo = Array.from({ length: p.pasos || 3 }, (_, i) => `<div class="grid" style="grid-template-columns:1fr 170px;gap:8px;margin-bottom:8px"><input class="input" name="${nombre}_texto${i + 1}" placeholder="Paso ${i + 1}: ¿qué voy a hacer?" value="${h(v ? v['texto' + (i + 1)] || '' : '')}"><input class="input" type="date" name="${nombre}_fecha${i + 1}" value="${h(v ? v['fecha' + (i + 1)] || '' : '')}"></div>`).join('');
  return `<fieldset class="pregunta" style="border:0;margin:0;padding-left:0;padding-right:0"><legend class="enun"><span class="n">${p.n}</span>${h(p.texto)}${p.obligatoria ? ' <span style="color:var(--ladrillo)">*</span>' : ''}</legend>${cuerpo}</fieldset>`;
}
function recogerRespuestas(preguntas, f) {
  const r = {};
  preguntas.forEach(p => {
    const n = 'p_' + p.id;
    if (p.tipo === 'likert' || p.tipo === 'unica') { const x = f.querySelector(`input[name="${n}"]:checked`); if (x) r[p.id] = x.value; }
    else if (p.tipo === 'multiple') r[p.id] = $$(`input[name="${n}"]:checked`, f).map(x => x.value);
    else if (p.tipo === 'abierta') { const t = f.querySelector(`[name="${n}"]`).value.trim(); if (t) r[p.id] = t; }
    else if (p.tipo === 'escala') { const o = {}; p.items.forEach(it => { const x = f.querySelector(`input[name="${n}_${it.id}"]:checked`); if (x) o[it.id] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
    else if (p.tipo === 'pareo') { const o = {}; p.items.forEach(it => { const x = f.querySelector(`[name="${n}_${it.id}"]`); if (x && x.value) o[it.id] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
    else if (p.tipo === 'pasos') { const o = {}; $$(`[name^="${n}_"]`, f).forEach(x => { if (x.value) o[x.name.slice(n.length + 1)] = x.value; }); if (Object.keys(o).length) r[p.id] = o; }
  });
  return r;
}

}

/* =====================================================================
 * ANÁLISIS IA (consistente y compartido por el equipo)
 * ===================================================================== */
async function panelIA(cont, params, etiqueta) {
  cont.innerHTML = cargando('Buscando el análisis vigente…');
  const pintar = (a) => {
    const k = a.contenido || {};
    const lista = (t, ico, arr) => arr && arr.length ? `<h4>${ico} ${t}</h4><ul>${arr.map(x => `<li>${h(x)}</li>`).join('')}</ul>` : '';
    cont.innerHTML = `<div class="ia-card"><div class="fila entre"><h3 style="margin:0">✨ Análisis e interpretación ${params.tipo === 'curso' ? 'del curso' : 'individual'}</h3>
      <div class="fila no-print">${a.existe ? '' : '<button class="btn oro mini" data-gen>Generar análisis</button>'}${a.desactualizado ? '<button class="btn oro mini" data-gen>Actualizar con datos nuevos</button>' : ''}${a.existe && E.perfil.rol === 'admin' ? '<button class="btn fantasma mini" data-forzar title="Solo administración">↻ Regenerar</button>' : ''}</div></div>
      ${!a.existe ? `<p class="muted">Aún no se ha generado el análisis para ${h(etiqueta)}. Al generarlo, quedará guardado y <b>todo el equipo verá exactamente el mismo</b> mientras los datos no cambien.</p>` : `
      ${a.desactualizado ? '<p class="chip alerta">Hay respuestas nuevas desde este análisis. Actualícelo para incluirlas.</p>' : ''}
      ${k.nota ? `<p class="chip alerta">${h(k.nota)}</p>` : ''}
      <p style="font-size:1.02rem">${h(k.resumen)}</p>
      <div class="grid g2">${'<div>' + lista('Fortalezas', '🌟', k.fortalezas) + lista('Aspectos a desarrollar', '🧩', k.focos) + lista('Alertas', '⚠️', k.alertas) + '</div><div>' + lista('Recomendaciones para el equipo', '🧭', k.recomendaciones) + lista('Decisiones de orientación', '✅', k.decisiones) + '</div>'}</div>
      ${k.mensajeEstudiante ? `<h4>💬 Mensaje sugerido para el estudiante</h4><p class="tarjeta plana" style="margin:0">${h(k.mensajeEstudiante)}</p>` : ''}
      ${k.sugerenciasFamilia ? `<h4>🏡 Sugerencia para la familia</h4><p style="margin:0">${h(k.sugerenciasFamilia)}</p>` : ''}
      <div class="sello">🔏 Análisis único compartido · ${a.motor === 'reglas' ? 'Motor de reglas del manual' : 'IA: ' + h(a.motor.split(':')[1] || a.motor)} · versión ${h(a.version)} · generado por ${h(a.generadoPorNombre)} el ${h(a.fecha)}</div>`}</div>`;
    $$('[data-gen]', cont).forEach(b => b.onclick = () => cargar({ generar: true }));
    const f = $('[data-forzar]', cont); if (f) f.onclick = () => { if (confirm('¿Regenerar el análisis? Reemplazará la versión vigente para todo el equipo.')) cargar({ generar: true, forzar: true }); };
  };
  const cargar = async (extra) => {
    if (extra) cont.innerHTML = cargando('Analizando resultados… puede tardar unos segundos.');
    try { pintar(await api('analisis', Object.assign({}, params, extra || {}))); } catch (e) { cont.innerHTML = vacio('⚠️', h(e.message)); }
  };
  cargar();
}

VISTAS.analisis = async (c, p) => {

  c.innerHTML = `<div class="tabs"><button class="tab ${tab === 'curso' ? 'activo' : ''}" data-tab="curso">👥 Por curso</button><button class="tab ${tab === 'estudiante' ? 'activo' : ''}" data-tab="estudiante">🎒 Por estudiante</button><button class="tab ${tab === 'historial' ? 'activo' : ''}" data-tab="historial">🗂️ Análisis del equipo</button></div>
    <div class="tarjeta plana peq" style="margin-bottom:16px">🔏 <b>Consistencia garantizada:</b> cada análisis se genera una sola vez por curso o estudiante con la misma pauta (manual docente §9). Si otro docente consulta al mismo estudiante, verá el mismo análisis; solo cambia cuando hay respuestas nuevas.</div>
    <div id="aCuerpo"></div>`;
  $$('[data-tab]', c).forEach(b => b.onclick = () => ir('analisis', { tab: b.dataset.tab }));

    cu.innerHTML = `<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Análisis</th><th>Estado</th><th>Resumen</th><th>Generado por</th><th>Fecha</th><th></th></tr></thead><tbody>
      ${hs.map(a => `<tr><td><b>${h(a.etiqueta)}</b><div class="muted peq">${a.tipo}</div></td><td>${a.vigente ? '<span class="chip ok">Vigente</span>' : '<span class="chip">Anterior</span>'}</td><td class="peq">${h(a.resumen)}…</td><td>${h(a.generadoPorNombre)}<div class="muted peq">${a.motor === 'reglas' ? 'reglas' : 'IA'}</div></td><td class="peq">${h(a.fecha)}</td>
      <td>${a.vigente ? `<button class="btn mini sec" data-ver='${h(JSON.stringify({ tipo: a.tipo, rut: a.rut, curso: a.curso }))}'>Abrir</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="6">${vacio('🗂️', 'Aún no hay análisis generados.')}</td></tr>`}</tbody></table></div>`;
    $$('[data-ver]', cu).forEach(b => b.onclick = () => { const x = JSON.parse(b.dataset.ver); if (x.tipo === 'estudiante') ir('estudiante', { rut: x.rut }); else { E.cursoSel = x.curso; ir('analisis', { tab: 'curso' }); } });
    return;
  }
  if (tab === 'estudiante') {
    const ests = await api('estudiantesCurso', { curso: E.cursoSel });
    cu.innerHTML = `<div class="fila">${sel}<select class="input" style="width:auto;min-width:260px" id="selEst"><option value="">Elija estudiante…</option>${ests.map(x => `<option value="${h(x.rut)}">${h(x.nombre)}</option>`).join('')}</select></div><div id="iaE" class="mt"></div>`;
    enlazarCurso(cu, () => ir('analisis', { tab: 'estudiante' }));
    $('#selEst').onchange = e => { if (e.target.value) ir('estudiante', { rut: e.target.value }); };

  }
  const d = await api('reporteCurso', { curso: E.cursoSel });
  cu.innerHTML = `<div class="fila entre">${sel}<button class="btn sec mini no-print" id="bImpA">🖨️ Imprimir / PDF</button></div><div id="repA" class="mt">${graficosCursoHTML(d)}<div class="mt2" id="iaC"></div></div>`;
  enlazarCurso(cu, () => ir('analisis', { tab: 'curso' }));
  dibujarGraficosCurso(d);
  panelIA($('#iaC'), { tipo: 'curso', curso: E.cursoSel }, 'el curso ' + E.cursoSel);
  $('#bImpA').onclick = () => imprimir($('#repA'), 'Análisis del curso ' + E.cursoSel);
};

function graficosCursoHTML(d) {
  const resp = d.filas.filter(f => f.completados > 0).length;
  return `<div class="grid g4 kpis"><div class="tarjeta kpi"><span class="ico">🎒</span><b>${d.estudiantes}</b><span>estudiantes</span></div><div class="tarjeta kpi"><span class="ico">✍️</span><b>${resp}</b><span>con respuestas</span></div>
    <div class="tarjeta kpi"><span class="ico">⚠️</span><b>${d.alertas.length}</b><span>con alertas</span></div><div class="tarjeta kpi"><span class="ico">🎯</span><b>${d.certeza.e3 !== null ? d.certeza.e3.toFixed(1) : '—'}</b><span>certeza final promedio</span></div></div>
    <div class="grid g2 mt"><div class="tarjeta"><h3>Promedio por indicador</h3><div class="lienzo"><canvas id="gProm"></canvas></div></div>
    <div class="tarjeta"><h3>Distribución de niveles</h3><div class="lienzo"><canvas id="gDist"></canvas></div></div>
    <div class="tarjeta"><h3>Intereses predominantes (RIASEC)</h3><div class="lienzo"><canvas id="gRia"></canvas></div></div>
    <div class="tarjeta"><h3>¿Qué influye más en su decisión? (E1)</h3><div class="lienzo"><canvas id="gInf"></canvas></div></div>
    <div class="tarjeta"><h3>Modalidades que conocen (E1)</h3><div class="lienzo"><canvas id="gMod"></canvas></div></div>
    <div class="tarjeta"><h3>Participación por instrumento</h3><div class="lienzo"><canvas id="gPar"></canvas></div></div></div>
    ${d.alertas.length ? `<div class="tarjeta mt"><h3>⚠️ Estudiantes que requieren seguimiento</h3><div class="tabla-wrap"><table class="tabla">${d.alertas.map(a => `<tr><td><b>${h(a.nombre)}</b></td><td>${a.alertas.map(x => `<span class="chip alerta">${h(x)}</span>`).join(' ')}</td></tr>`).join('')}</table></div></div>` : ''}`;
}
function dibujarGraficosCurso(d) {
  graficar($('#gProm'), { type: 'bar', data: { labels: DIM.map(x => x[1]), datasets: [{ data: DIM.map(x => d.promedios[x[0]]), backgroundColor: ['#0b2a66', '#1f9e8f', '#e3b505', '#c8553d'], borderRadius: 10 }] }, options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 4 } } } });
  const nv = ['No logrado', 'En desarrollo', 'Logrado', 'Logrado sólidamente'], cnv = ['#e8857e', '#f2b66d', '#7fcfa7', '#1f9e6b'];
  graficar($('#gDist'), { type: 'bar', data: { labels: DIM.map(x => x[1]), datasets: nv.map((n, i) => ({ label: n, data: DIM.map(x => d.distribucion[x[0]][i]), backgroundColor: cnv[i] })) }, options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { legend: { position: 'bottom' } } } });
  graficar($('#gRia'), { type: 'polarArea', data: { labels: 'RIASEC'.split('').map(l => l + ' ' + RIASEC_T[l]), datasets: [{ data: 'RIASEC'.split('').map(l => d.riasec[l]), backgroundColor: COLORES.map(x => x + 'cc') }] }, options: { plugins: { legend: { position: 'right' } } } });
  const inf = Object.keys(d.influencia);
  graficar($('#gInf'), { type: 'doughnut', data: { labels: inf.length ? inf : ['Sin datos'], datasets: [{ data: inf.length ? inf.map(k => d.influencia[k]) : [1], backgroundColor: inf.length ? COLORES : ['#e3e0d8'] }] }, options: { plugins: { legend: { position: 'right' } }, cutout: '58%' } });
  const mod = ['Científico-humanista', 'Técnico-profesional', 'Artística', 'No conozco ninguna'];
  graficar($('#gMod'), { type: 'bar', data: { labels: mod, datasets: [{ data: mod.map(m => d.modalidades[m] || 0), backgroundColor: '#0f4c9c', borderRadius: 8 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  const ins = ['E1', 'RIASEC', 'E2', 'TRAMPAS', 'E3', 'AUTONOMIA'];
  graficar($('#gPar'), { type: 'bar', data: { labels: ins, datasets: [{ label: 'Respondieron', data: ins.map(k => d.participacion[k] || 0), backgroundColor: '#e3b505', borderRadius: 8 }, { label: 'Total', data: ins.map(() => d.estudiantes), backgroundColor: '#e3e0d8', borderRadius: 8 }] }, options: { plugins: { legend: { position: 'bottom' } } } });
}

    ${d.cuestionarios.length ? d.cuestionarios.map((q, qi) => `<div class="tarjeta mt"><div class="fila entre"><h3 style="margin:0"><span class="chip">${h(q.codigo)}</span> ${h(q.titulo)}</h3><span class="chip ${q.respondieron ? 'ok' : ''}">${q.respondieron} respuesta(s)</span></div>
      <div class="grid g2 mt">${q.preguntas.map((pr, pi) => `<div class="tarjeta plana"><b class="peq">${pr.n}. ${h(pr.texto)}</b>${Object.keys(pr.conteo).length ? `<div class="lienzo" style="height:200px"><canvas data-g="${qi}-${pi}"></canvas></div>` : ''}
        ${pr.abiertas.length ? `<div style="max-height:200px;overflow:auto" class="mt">${pr.abiertas.map(a => `<p class="peq" style="margin:.3em 0;border-left:3px solid var(--oro);padding-left:8px"><b>${h(a.nombre.split(' ')[0])}:</b> ${h(a.texto)}</p>`).join('')}</div>` : ''}
        ${!Object.keys(pr.conteo).length && !pr.abiertas.length ? '<p class="muted peq">Sin respuestas.</p>' : ''}</div>`).join('')}</div></div>`).join('') : vacio('📝', 'Esta sesión no tiene cuestionarios asociados.')}`;
  d.cuestionarios.forEach((q, qi) => q.preguntas.forEach((pr, pi) => {
    const k = Object.keys(pr.conteo); if (!k.length) return;
    graficar($(`[data-g="${qi}-${pi}"]`, rs), { type: 'bar', data: { labels: k.map(x => x.length > 28 ? x.slice(0, 26) + '…' : x), datasets: [{ data: k.map(x => pr.conteo[x]), backgroundColor: COLORES[pi % COLORES.length], borderRadius: 6 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } } });
  }));
  $('#bImpS').onclick = () => imprimir(rs, 'Reporte de sesión · ' + d.sesion.titulo + ' · ' + d.curso);
  $('#bCsvS').onclick = () => {
    const filas = [['Cuestionario', 'Estudiante', 'Responde', 'Fecha', 'Pregunta', 'Respuesta', 'Puntajes']];
    d.cuestionarios.forEach(q => q.filas.forEach(f => Object.keys(f.respuestas).forEach(k => filas.push([q.codigo, f.nombre, f.quien, f.fecha, k, valorTxt(f.respuestas[k]), JSON.stringify(f.puntajes)]))));
    descargar(`sesion-${d.sesion.numero}-${d.curso}.csv`, csv(filas), 'text/csv;charset=utf-8');
  };
};

function formUsuario(u, cursos) {
  const personal = !u || ['admin', 'docente', 'asistente'].includes(u.rol);
  const c = modal(`<h2>${u ? 'Editar cuenta' : 'Nuevo integrante del equipo'}</h2>
    ${!u ? '<label class="campo"><span>RUT</span><input class="input" id="fRut" placeholder="12.345.678-9"></label>' : `<p class="muted">${h(u.rut)} · ${h(ROL_TXT[u.rol])}</p>`}
    <label class="campo"><span>Nombre completo</span><input class="input" id="fNom" value="${h(u ? u.nombre : '')}"></label>
    ${personal ? `<label class="campo"><span>Rol</span><select class="input" id="fRol">${['docente', 'asistente', 'admin'].map(r => `<option value="${r}" ${u && u.rol === r ? 'selected' : ''}>${ROL_TXT[r]}</option>`).join('')}</select></label>
    <label class="campo"><span>Cursos asignados</span><select class="input" id="fCur" multiple size="${Math.min(8, cursos.length || 2)}">${cursos.map(x => `<option ${u && (u.cursos || '').split(/[,;]/).map(s => s.trim()).includes(x.curso) ? 'selected' : ''}>${h(x.curso)}</option>`).join('')}</select><small>También puede escribirlos: <input class="input mt" id="fCurTxt" placeholder="8° A, 8° B" value="${h(u ? u.cursos : '')}"></small></label>
    <label class="campo"><span>Correo (opcional)</span><input class="input" id="fMail" type="email" value="${h(u ? u.email : '')}"></label>` : ''}
    ${u ? `<label class="fila"><input type="checkbox" id="fAct" ${u.activo ? 'checked' : ''}> Cuenta activa</label>` : ''}
    <div class="fila mt"><button class="btn oro" id="bGU">Guardar</button><button class="btn fantasma" data-cerrar>Cancelar</button></div>`);
  if ($('#fCur', c)) $('#fCur', c).onchange = e => { $('#fCurTxt', c).value = Array.from(e.target.selectedOptions).map(o => o.value).join(', '); };
  $('#bGU', c).onclick = async () => {
    const d = { id: u && u.id, nombre: $('#fNom', c).value };
    if (!u) d.rut = $('#fRut', c).value;
    if ($('#fRol', c)) Object.assign(d, { rol: $('#fRol', c).value, cursos: $('#fCurTxt', c).value, email: $('#fMail', c).value });
    if ($('#fAct', c)) d.activo = $('#fAct', c).checked;
    try {
      const r = await api('guardarUsuario', d); E._cursos = null;
      if (r.claveTemporal) modal(`<h2>Cuenta creada</h2><p>Entregue al usuario su RUT y esta <b>clave temporal</b> de forma privada. Deberá cambiarla en su primer ingreso.</p><p class="display" style="font-size:2rem;text-align:center">${h(r.claveTemporal)}</p><button class="btn oro" data-cerrar onclick="ir('usuarios')">Listo</button>`);
      else { cerrarModal(); toast('Cuenta guardada'); ir('usuarios'); }
    } catch (e) { toast(e.message, true); }
  };
}

VISTAS.carga = async (c) => {
  c.innerHTML = `<div class="grid g2"><div class="tarjeta"><h3>📥 Carga masiva de estudiantes y apoderados</h3>
      <p class="peq">Suba un Excel (.xlsx) o CSV con estas columnas, en la primera fila:</p>
      <div class="fila" style="gap:6px">${COLUMNAS.map(x => `<span class="chip">${x}</span>`).join('')}</div>
      <ul class="peq mt"><li>Se crea una cuenta para el <b>estudiante</b>, la <b>madre</b> y el <b>padre</b> (si vienen sus nombres), cada una con clave independiente = fecha de nacimiento del estudiante (DDMMAAAA).</li>
      <li>Si el <b>tutor</b> no es ni el padre ni la madre, se crea un acceso adicional de tutor.</li>
      <li>Si el estudiante ya existe, se actualizan sus datos sin cambiar claves.</li></ul>
      <button class="btn sec mini" id="bPlantilla">⬇️ Descargar plantilla Excel</button></div>
    <div class="tarjeta"><div class="drop" id="drop">Arrastre el archivo aquí o <label style="color:var(--mar);cursor:pointer;font-weight:700">elíjalo<input type="file" id="fx" accept=".xlsx,.xls,.csv" hidden></label></div><div id="prev" class="mt"></div></div></div>`;
  $('#bPlantilla').onclick = () => {
    const ws = XLSX.utils.aoa_to_sheet([COLUMNAS, ['12345678', '5', 'Nombre Apellido Apellido', 'F', '05-03-2012', '8° A', 'Concepción', '01-03-2026', 'Calle 123', 'Concepción', 'Nombre del padre', 'Nombre de la madre', '']]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Estudiantes'); XLSX.writeFile(wb, 'plantilla_carga_estudiantes.xlsx');
  };
  const procesar = async (file) => {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: false, raw: false });
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
    if (!filas.length) return toast('El archivo no tiene filas.', true);
    const faltan = ['Rut', 'DV', 'NombreAlumno', 'FechaNac', 'Curso'].filter(k => !Object.keys(filas[0]).some(x => x.replace(/\s/g, '').toLowerCase() === k.replace(/\s/g, '').toLowerCase()));
    const cursos = {}; filas.forEach(f => { const k = f.Curso || f.curso; cursos[k] = (cursos[k] || 0) + 1; });
    $('#prev').innerHTML = `<h3>${filas.length} filas · ${Object.keys(cursos).length} curso(s)</h3>
      ${faltan.length ? `<p class="chip peligro">Faltan columnas: ${faltan.join(', ')}</p>` : ''}
      <div class="fila">${Object.keys(cursos).map(k => `<span class="chip">${h(k)}: ${cursos[k]}</span>`).join('')}</div>
      <div class="tabla-wrap mt" style="max-height:220px"><table class="tabla"><tr>${Object.keys(filas[0]).slice(0, 7).map(k => `<th>${h(k)}</th>`).join('')}</tr>${filas.slice(0, 5).map(f => `<tr>${Object.keys(filas[0]).slice(0, 7).map(k => `<td class="peq">${h(f[k])}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="progreso mt"><div id="pb" style="width:0"></div></div><p id="pst" class="muted peq"></p>
      <button class="btn oro" id="bImportar" ${faltan.length ? 'disabled' : ''}>Importar ${filas.length} estudiantes</button>`;
    $('#bImportar').onclick = async ev => {
      ev.target.disabled = true;
      const tot = { creados: 0, actualizados: 0, cuentas: 0, errores: [] };
      const lote = 60;
      for (let i = 0; i < filas.length; i += lote) {
        $('#pst').textContent = `Procesando ${Math.min(i + lote, filas.length)} de ${filas.length}…`;
        try {
          const r = await api('importar', { filas: filas.slice(i, i + lote) });
          tot.creados += r.creados; tot.actualizados += r.actualizados; tot.cuentas += r.cuentas;
          tot.errores.push(...r.errores.map(e => e.replace(/Fila (\d+)/, (m, n) => 'Fila ' + (Number(n) + i))));
        } catch (e) { tot.errores.push(`Lote ${i / lote + 1}: ${e.message}`); }
        $('#pb').style.width = Math.round(100 * Math.min(i + lote, filas.length) / filas.length) + '%';
      }
      E._cursos = null;
      $('#pst').innerHTML = `<b>Listo:</b> ${tot.creados} nuevos, ${tot.actualizados} actualizados, ${tot.cuentas} cuentas creadas.${tot.errores.length ? `<br><span style="color:var(--peligro)">${tot.errores.length} fila(s) con problemas:</span><br>${tot.errores.slice(0, 30).map(h).join('<br>')}` : ''}`;
      toast('Importación terminada');
    };
  };
  $('#fx').onchange = e => e.target.files[0] && procesar(e.target.files[0]);
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('sobre'); };
  drop.ondragleave = () => drop.classList.remove('sobre');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('sobre'); if (e.dataTransfer.files[0]) procesar(e.dataTransfer.files[0]); };
};
